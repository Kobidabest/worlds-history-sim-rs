name: Pages

# Publish the standalone evolution simulator at the repo's GitHub Pages URL.
# Runs on every push to main; can also be triggered manually from the
# Actions tab to deploy any branch (handy for previewing dev work).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site
          # Serve the simulator as the root index so the URL is clean.
          cp evolution-simulator.html _site/index.html
          # Also keep the original filename for any existing deep links.
          cp evolution-simulator.html _site/evolution-simulator.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

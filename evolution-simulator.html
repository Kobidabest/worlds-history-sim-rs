    };
  }
}

// ============================================================
// RENDERER
// ============================================================
class Renderer {
  constructor(canvas, sim) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.sim = sim;
    this.viewMode = 'biome';
    this.showCreatures = true;
    this.tileSize = CFG.TILE_SIZE;
    this.offsetX = 0;
    this.offsetY = 0;
    this.scale = 1;
    // User-controlled zoom & pan, applied on top of the fit-to-screen scale.
    // viewZoom = 1 means "fit the whole map"; >1 zooms in; <1 lets you see
    // beyond the map edges (clamped to MIN_ZOOM).
    this.viewZoom = 1;
    this.viewPanX = 0;
    this.viewPanY = 0;
    this.terrainBuffer = null;
    this.terrainDirty = true;

    this.resize();
    this.buildTerrainBuffer();
  }

  resize() {
    const wrap = this.canvas.parentElement;
    const cw = wrap.clientWidth;
    const ch = wrap.clientHeight;
    // Back the canvas at device-pixel resolution so the map stays crisp
    // on mobile and Retina displays while the CSS box keeps its size.
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    this.dpr = dpr;
    this.canvas.style.width = cw + 'px';
    this.canvas.style.height = ch + 'px';
    this.canvas.width = Math.max(1, Math.round(cw * dpr));
    this.canvas.height = Math.max(1, Math.round(ch * dpr));

    // Fit world to screen (all sizing in backing-store pixels).
    const sx = this.canvas.width / (CFG.W * this.tileSize);
    const sy = this.canvas.height / (CFG.H * this.tileSize);
    this.scale = Math.min(sx, sy);

    // Center
    this.offsetX = (this.canvas.width - CFG.W * this.tileSize * this.scale) / 2;
    this.offsetY = (this.canvas.height - CFG.H * this.tileSize * this.scale) / 2;
    // Resize can leave the previous pan pointing off-canvas (e.g. after a
    // rotation); rein it back in so the map doesn't disappear.
    this.clampPan();
  }

  buildTerrainBuffer() {
    const w = CFG.W, h = CFG.H;
    const imgData = new ImageData(w, h);
    const data = imgData.data;
    const world = this.sim.world;

    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const i = y * w + x;
        const pi = i * 4;
        let r, g, b;

        if (this.viewMode === 'biome') {
          // Each biome (including the alien ones) has its own colour, so the
          // map directly shows the world's biome mosaic. Altitude darkens
          // highlands; plant cover deepens the green of vegetated land.
          const biome = BIOME_LIST[world.biome[i]];
          const altShade = world.altitude[i] > 0 ? 1.0 - (world.altitude[i] / 30000) : 1.0;
          const bc = biome.color;
          r = bc[0] * altShade;
          g = bc[1] * altShade;
          b = bc[2] * altShade;
          // Vegetated tiles tint toward their standing plant biomass.
          const eco = this.sim.ecosystem[i];
          if (eco && eco.baseCap > 0.5) {
            const cover = Math.min(1, eco.plantBiomass / (eco.baseCap * eco.plantPheno.capacity + 1));
            r = r * (1 - cover * 0.35);
            g = g * (1 - cover * 0.1) + cover * 30;
            b = b * (1 - cover * 0.35);
          }
        } else if (this.viewMode === 'plants') {
          // Plant biomass: bare → lush green.
          const eco = this.sim.ecosystem[i];
          if (world.altitude[i] < 0) { r = 18; g = 24; b = 38; }
          else {
            const cap = eco.baseCap * eco.plantPheno.capacity;
            const norm = cap > 0.5 ? Math.min(1, eco.plantBiomass / cap) : 0;
            r = 40 - norm * 20; g = 50 + norm * 170; b = 40 - norm * 20;
          }
        } else if (this.viewMode === 'microbes') {
          // Microbial biomass: faint → vivid teal/violet.
          const eco = this.sim.ecosystem[i];
          const norm = Math.min(1, eco.microbeBiomass / 40);
          r = 30 + norm * 120; g = 20 + norm * 120; b = 40 + norm * 160;
        } else if (this.viewMode === 'altitude') {
          const norm = (world.altitude[i] + 15000) / 30000;
          if (world.altitude[i] < 0) {
            r = 20; g = 30 + norm * 100; b = 100 + norm * 155;
          } else {
            r = 50 + norm * 180; g = 120 + norm * 100; b = 40;
          }
        } else if (this.viewMode === 'temperature') {
          const norm = (world.temperature[i] + 35) / 65;
          r = norm * 255;
          g = (1 - Math.abs(norm - 0.5) * 2) * 180;
          b = (1 - norm) * 255;
        } else if (this.viewMode === 'rainfall') {
          const norm = world.rainfall[i] / 13000;
          r = 20;
          g = 40 + norm * 200;
          b = 80 + norm * 175;
        } else if (this.viewMode === 'carrion') {
          // Dark base with red carrion intensity.
          const eco = this.sim.ecosystem[i];
          const norm = Math.min(1, eco.carrion / 5);
          r = 30 + norm * 200; g = 20; b = 20;
        } else if (this.viewMode === 'nutrients') {
          // Soil fertility: brown→green.
          const eco = this.sim.ecosystem[i];
          const norm = Math.min(1, eco.nutrients / 20);
          r = 40 + norm * 60; g = 30 + norm * 170; b = 25;
        } else if (this.viewMode === 'disease') {
          // Ocean-blue base; infection density glows magenta (filled below).
          if (world.altitude[i] < 0) { r = 18; g = 28; b = 42; }
          else { r = 30; g = 34; b = 30; }
        }

        data[pi] = Math.max(0, Math.min(255, r));
        data[pi + 1] = Math.max(0, Math.min(255, g));
        data[pi + 2] = Math.max(0, Math.min(255, b));
        data[pi + 3] = 255;
      }
    }

    // Create offscreen canvas for terrain
    const offscreen = document.createElement('canvas');
    offscreen.width = w;
    offscreen.height = h;
    offscreen.getContext('2d').putImageData(imgData, 0, 0);
    this.terrainBuffer = offscreen;
    this.terrainDirty = false;
  }

  draw() {
    // Carrion, nutrient and disease overlays change every tick, so their
    // terrain buffer must be rebuilt continuously rather than cached.
    const dynamicView = (this.viewMode === 'carrion' || this.viewMode === 'nutrients'
      || this.viewMode === 'disease' || this.viewMode === 'plants' || this.viewMode === 'microbes');
    if (this.terrainDirty || dynamicView) this.buildTerrainBuffer();

    const ctx = this.ctx;
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

    ctx.save();
    // Apply user pan/zoom on top of the fit-to-screen transform.
    ctx.translate(this.offsetX + this.viewPanX, this.offsetY + this.viewPanY);
    const s = this.scale * this.tileSize * this.viewZoom;
    ctx.scale(s, s);

    // Draw terrain
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(this.terrainBuffer, 0, 0);

    // Draw creatures
    if (this.showCreatures) {
      const diseaseView = (this.viewMode === 'disease');
      for (const c of this.sim.creatures) {
        if (!c.alive) continue;
        if (diseaseView) {
          // Infection lens: sick = magenta, immune = cyan, healthy = grey.
          ctx.fillStyle = c.infected ? '#ff3df0' : (c.resistant ? '#40e0d0' : '#556');
        } else {
          const sp = this.sim.speciesMap.get(c.speciesId);
          ctx.fillStyle = sp ? `rgb(${sp.color[0]},${sp.color[1]},${sp.color[2]})` : '#fff';
        }
        const size = Math.max(0.3, Math.min(0.9, c.pheno.bodySize / 5));
        const off = (1 - size) / 2;
        ctx.fillRect(c.x + off, c.y + off, size, size);
        // Juveniles get a faint dimming so growth is visible on the map.
        if (!diseaseView && c.age < c.pheno.maturityAge) {
          ctx.fillStyle = 'rgba(0,0,0,0.35)';
          ctx.fillRect(c.x + off, c.y + off, size, size);
        }
      }
    }

    // Draw selected tile highlight
    if (this.sim.selectedTile) {
      const [sx, sy] = this.sim.selectedTile;
      ctx.strokeStyle = '#e94560';
      ctx.lineWidth = 0.15;
      ctx.strokeRect(sx, sy, 1, 1);
    }

    ctx.restore();
  }

  screenToTile(sx, sy) {
    // Incoming coords are CSS pixels from getBoundingClientRect(); convert
    // to backing-store pixels before reversing the canvas transform.
    const dpr = this.dpr || 1;
    sx *= dpr;
    sy *= dpr;
    const s = this.scale * this.tileSize * this.viewZoom;
    const tx = Math.floor((sx - this.offsetX - this.viewPanX) / s);
    const ty = Math.floor((sy - this.offsetY - this.viewPanY) / s);
    if (tx >= 0 && tx < CFG.W && ty >= 0 && ty < CFG.H) return [tx, ty];
    return null;
  }

  /// Reset zoom & pan to the fit-to-screen view.
  resetView() {
    this.viewZoom = 1;
    this.viewPanX = 0;
    this.viewPanY = 0;
  }

  /// Zoom around a point given in CSS pixels (from getBoundingClientRect).
  /// Keeps the world coordinate under the cursor stationary.
  zoomAround(cssX, cssY, factor) {
    const dpr = this.dpr || 1;
    const px = cssX * dpr, py = cssY * dpr;
    const oldZoom = this.viewZoom;
    const newZoom = Math.max(1, Math.min(8, oldZoom * factor));
    if (newZoom === oldZoom) return;
    // Pan correction so the point under the cursor stays put:
    //   px = offsetX + viewPanX_old + worldX * scale * tileSize * oldZoom
    //   px = offsetX + viewPanX_new + worldX * scale * tileSize * newZoom
    // => viewPanX_new = viewPanX_old + (oldZoom - newZoom) * (px - offsetX - viewPanX_old) / oldZoom
    const ratio = (newZoom - oldZoom) / oldZoom;
    this.viewPanX -= (px - this.offsetX - this.viewPanX) * ratio;
    this.viewPanY -= (py - this.offsetY - this.viewPanY) * ratio;
    this.viewZoom = newZoom;
    this.clampPan();
  }

  /// Pan by a delta in CSS pixels.
  panBy(cssDx, cssDy) {
    const dpr = this.dpr || 1;
    this.viewPanX += cssDx * dpr;
    this.viewPanY += cssDy * dpr;
    this.clampPan();
  }

  /// Keep the map at least partly on-screen so users can't lose it.
  clampPan() {
    const s = this.scale * this.tileSize * this.viewZoom;
    const mapW = CFG.W * s;
    const mapH = CFG.H * s;
    // Allow panning up to 80% of the map off-screen — enough freedom but
    // a corner is always visible.
    const slackX = mapW * 0.8;
    const slackY = mapH * 0.8;
    const minX = -this.offsetX - slackX;
    const maxX = this.canvas.width - this.offsetX - mapW + slackX;
    const minY = -this.offsetY - slackY;
    const maxY = this.canvas.height - this.offsetY - mapH + slackY;
    if (minX < maxX) this.viewPanX = Math.max(minX, Math.min(maxX, this.viewPanX));
    if (minY < maxY) this.viewPanY = Math.max(minY, Math.min(maxY, this.viewPanY));
  }
}

// ============================================================
// GRAPH RENDERER
// ============================================================
function drawPopulationGraph(canvas, history, species) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width = canvas.parentElement.clientWidth - 20;
  const h = canvas.height = 200;

  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, w, h);

  if (history.length < 2) return;

  const maxPop = Math.max(10, ...history.map(h => h.total));
  const pad = {l: 40, r: 10, t: 10, b: 20};
  const gw = w - pad.l - pad.r;
  const gh = h - pad.t - pad.b;

  // Grid
  ctx.strokeStyle = '#0f3460';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= 4; i++) {
    const y = pad.t + (gh / 4) * i;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke();
    ctx.fillStyle = '#606080';
    ctx.font = '10px system-ui';
    ctx.textAlign = 'right';
    ctx.fillText(Math.round(maxPop * (1 - i / 4)), pad.l - 4, y + 4);
  }

  // Lines
  const drawLine = (key, color) => {
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    for (let i = 0; i < history.length; i++) {
      const x = pad.l + (i / (history.length - 1)) * gw;
      const y = pad.t + gh - (history[i][key] / maxPop) * gh;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  };

  drawLine('total', '#e0e0e0');
  drawLine('herbivores', '#66cc66');
  drawLine('carnivores', '#e94560');

  // Axis labels
  ctx.fillStyle = '#606080';
  ctx.font = '10px system-ui';
  ctx.textAlign = 'center';
  if (history.length > 0) {
    ctx.fillText(`Tick ${history[0].tick}`, pad.l, h - 2);
    ctx.fillText(`Tick ${history[history.length - 1].tick}`, w - pad.r, h - 2);
  }
}

// ============================================================
// UI CONTROLLER
// ============================================================
class App {
  constructor() {
    this.sim = null;
    this.renderer = null;
    this.speed = 3;
    this.animId = null;
    this.lastFrame = 0;
    this.sidebarCollapsed = false;
  }

  init() {
    this.populatePlanetSelect();
    this.showLoading(0, "Generating world...");

    setTimeout(() => {
      const seed = Date.now() ^ (Math.random() * 0xffffffff);
      this.sim = new Simulation(seed, this.selectedPlanet());
      this.showLoading(50, "Populating creatures...");

      setTimeout(() => {
        const canvas = document.getElementById('world-canvas');
        this.renderer = new Renderer(canvas, this.sim);
        this.showLoading(80, "Rendering...");

        setTimeout(() => {
          this.setupUI();
          this.hideLoading();
          this.startLoop();
        }, 50);
      }, 50);
    }, 50);
  }

  showLoading(pct, text) {
    document.getElementById('load-bar').style.width = pct + '%';
    document.getElementById('load-text').textContent = text;
  }

  populatePlanetSelect() {
    const sel = document.getElementById('planet-select');
    if (!sel || sel.options.length > 0) return;
    for (const p of PLANETS) {
      const opt = document.createElement('option');
      opt.value = p.id;
      opt.textContent = p.name;
      sel.appendChild(opt);
    }
  }

  selectedPlanet() {
    const sel = document.getElementById('planet-select');
    if (!sel) return DEFAULT_PLANET;
    const id = sel.value;
    return PLANETS.find(p => p.id === id) || DEFAULT_PLANET;
  }

  hideLoading() {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
  }

  setupUI() {
    // Pause button
    document.getElementById('btn-pause').addEventListener('click', () => {
      this.sim.paused = !this.sim.paused;
      document.getElementById('btn-pause').textContent = this.sim.paused ? 'Play' : 'Pause';
      document.getElementById('btn-pause').classList.toggle('active', this.sim.paused);
    });

    // Speed slider
    document.getElementById('speed-slider').addEventListener('input', (e) => {
      this.speed = parseInt(e.target.value);
    });

    // View select
    document.getElementById('view-select').addEventListener('change', (e) => {
      this.renderer.viewMode = e.target.value;
      this.renderer.terrainDirty = true;
    });

    // Show creatures toggle
    document.getElementById('btn-creatures').addEventListener('click', (e) => {
      this.renderer.showCreatures = !this.renderer.showCreatures;
      e.target.classList.toggle('active', this.renderer.showCreatures);
    });

    // New world
    document.getElementById('btn-new').addEventListener('click', () => {
      const seed = Date.now() ^ (Math.random() * 0xffffffff);
      nextSpeciesId = 0;
      this.sim = new Simulation(seed, this.selectedPlanet());
      this.renderer.sim = this.sim;
      this.renderer.terrainDirty = true;
      this.renderer.resetView();
    });

    // Switching planet without changing seed also regenerates the world —
    // otherwise the selector looks like it does nothing until you hit "New".
    document.getElementById('planet-select').addEventListener('change', () => {
      const seed = Date.now() ^ (Math.random() * 0xffffffff);
      nextSpeciesId = 0;
      this.sim = new Simulation(seed, this.selectedPlanet());
      this.renderer.sim = this.sim;
      this.renderer.terrainDirty = true;
      this.renderer.resetView();
    });

    // Sidebar toggle (+ mobile backdrop).
    const sidebarToggle = document.getElementById('sidebar-toggle');
    const backdrop = document.getElementById('sidebar-backdrop');
    const isMobile = () => window.innerWidth <= 600;
    const setSidebar = (collapsed) => {
      this.sidebarCollapsed = collapsed;
      document.getElementById('sidebar').classList.toggle('collapsed', collapsed);
      sidebarToggle.classList.toggle('collapsed', collapsed);
      sidebarToggle.innerHTML = collapsed ? '&rsaquo;' : '&lsaquo;';
      backdrop.classList.toggle('show', !collapsed && isMobile());
      setTimeout(() => this.renderer.resize(), 250);
    };
    sidebarToggle.addEventListener('click', () => setSidebar(!this.sidebarCollapsed));
    backdrop.addEventListener('click', () => setSidebar(true));
    // Start collapsed on mobile so the map is visible on first load.
    if (isMobile()) setSidebar(true);
    // Re-evaluate backdrop visibility on orientation/viewport changes:
    // if the user rotates from mobile portrait to a wide landscape, the
    // sidebar should stop pretending to be a modal.
    window.addEventListener('resize', () => {
      backdrop.classList.toggle('show', !this.sidebarCollapsed && isMobile());
    });

    // Tab switching
    document.querySelectorAll('#tab-bar button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#tab-bar button').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab).classList.add('active');
      });
    });

    // Canvas tap for tile info — handled separately for mouse vs touch so
    // that scrolls/drags don't fire taps on mobile.
    const canvas = document.getElementById('world-canvas');
    const handleTap = (clientX, clientY) => {
      const rect = canvas.getBoundingClientRect();
      const x = clientX - rect.left;
      const y = clientY - rect.top;
      const tile = this.renderer.screenToTile(x, y);
      if (tile) {
        this.sim.selectedTile = tile;
        this.updateTileInfo(tile[0], tile[1]);
        // Switch to tile tab
        document.querySelectorAll('#tab-bar button').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelector('[data-tab="tile-tab"]').classList.add('active');
        document.getElementById('tile-tab').classList.add('active');
        // Auto-open the sidebar on mobile so the tap actually leads somewhere.
        if (isMobile() && this.sidebarCollapsed) setSidebar(false);
      }
    };
    // ---- Mouse path ---------------------------------------------------
    // The click event also fires after a touch tap; we suppress it briefly
    // so we don't double-handle. Mouse drag pans, wheel zooms.
    let suppressClickUntil = 0;
    let mouseDrag = null;
    canvas.addEventListener('mousedown', (e) => {
      mouseDrag = { x: e.clientX, y: e.clientY, moved: 0 };
    });
    canvas.addEventListener('mousemove', (e) => {
      if (!mouseDrag) return;
      const dx = e.clientX - mouseDrag.x;
      const dy = e.clientY - mouseDrag.y;
      mouseDrag.moved += Math.abs(dx) + Math.abs(dy);
      if (mouseDrag.moved > 4) {
        this.renderer.panBy(dx, dy);
        mouseDrag.x = e.clientX;
        mouseDrag.y = e.clientY;
      }
    });
    canvas.addEventListener('mouseup', () => { mouseDrag = null; });
    canvas.addEventListener('mouseleave', () => { mouseDrag = null; });
    canvas.addEventListener('click', (e) => {
      if (Date.now() < suppressClickUntil) return;
      // Treat as tap only if the mouse barely moved.
      if (mouseDrag && mouseDrag.moved > 4) return;
      handleTap(e.clientX, e.clientY);
    });
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      // Smooth, bounded wheel zoom (works for trackpad + mouse wheel).
      const factor = Math.exp(-e.deltaY * 0.0015);
      this.renderer.zoomAround(x, y, factor);
    }, { passive: false });

    // ---- Touch path ---------------------------------------------------
    // 1 finger:  tap selects a tile; sliding > 12px starts panning.
    // 2 fingers: pinch zoom around the midpoint, also pans together.
    // Double-tap: reset zoom & pan.
    let touchStart = null;     // { x, y, time } when 1-finger
    let panAnchor = null;      // last 1-finger position while panning
    let pinchAnchor = null;    // { dist, mx, my } between two fingers
    let lastTapTime = 0;

    const touchMid = (a, b) => ({
      x: (a.clientX + b.clientX) / 2,
      y: (a.clientY + b.clientY) / 2,
      d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY)
    });

    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        const t = e.touches[0];
        touchStart = { x: t.clientX, y: t.clientY, time: Date.now() };
        panAnchor = { x: t.clientX, y: t.clientY };
        pinchAnchor = null;
      } else if (e.touches.length === 2) {
        // Switching from 1 finger to 2: cancel pending tap & pan.
        touchStart = null;
        panAnchor = null;
        const m = touchMid(e.touches[0], e.touches[1]);
        pinchAnchor = m;
      }
    }, { passive: true });

    canvas.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1 && panAnchor) {
        const t = e.touches[0];
        const dx = t.clientX - panAnchor.x;
        const dy = t.clientY - panAnchor.y;
        if (touchStart) {
          // While we still might be a tap, only commit to a pan once moved.
          if (Math.hypot(t.clientX - touchStart.x, t.clientY - touchStart.y) > 12) {
            touchStart = null;
          }
        }
        if (!touchStart) {
          this.renderer.panBy(dx, dy);
          panAnchor.x = t.clientX;
          panAnchor.y = t.clientY;
          e.preventDefault();
        }
      } else if (e.touches.length === 2 && pinchAnchor) {
        e.preventDefault();
        const m = touchMid(e.touches[0], e.touches[1]);
        const rect = canvas.getBoundingClientRect();
        // Pinch zoom about the midpoint.
        if (pinchAnchor.d > 0) {
          const factor = m.d / pinchAnchor.d;
          this.renderer.zoomAround(m.x - rect.left, m.y - rect.top, factor);
        }
        // Two-finger pan along with the pinch.
        this.renderer.panBy(m.x - pinchAnchor.x, m.y - pinchAnchor.y);
        pinchAnchor = m;
      }
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
      // Tap detection (1-finger, short, didn't drag).
      if (touchStart && e.changedTouches.length > 0 && e.touches.length === 0) {
        const t = e.changedTouches[0];
        const dx = Math.abs(t.clientX - touchStart.x);
        const dy = Math.abs(t.clientY - touchStart.y);
        const dt = Date.now() - touchStart.time;
        if (dx <= 12 && dy <= 12 && dt < 600) {
          suppressClickUntil = Date.now() + 500;
          // Double-tap → reset view.
          if (Date.now() - lastTapTime < 320) {
            this.renderer.resetView();
            lastTapTime = 0;
          } else {
            lastTapTime = Date.now();
            handleTap(t.clientX, t.clientY);
          }
          e.preventDefault();
        }
      }
      // Clean up gesture state when fingers leave.
      if (e.touches.length === 0) {
        touchStart = null;
        panAnchor = null;
        pinchAnchor = null;
      } else if (e.touches.length === 1) {
        // Lifted to 1 finger — restart panning from the remaining finger.
        const t = e.touches[0];
        panAnchor = { x: t.clientX, y: t.clientY };
        pinchAnchor = null;
        touchStart = null; // never treat post-pinch lift as a tap
      }
    }, { passive: false });

    canvas.addEventListener('touchcancel', () => {
      touchStart = null; panAnchor = null; pinchAnchor = null;
    });

    // Resize — also re-fit on orientation changes, soft-keyboard show/hide,
    // and iOS Safari address-bar collapse via visualViewport.
    const onResize = () => this.renderer.resize();
    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', () => {
      // Some browsers report stale dimensions until after the rotate finishes.
      setTimeout(onResize, 150);
      setTimeout(onResize, 400);
    });
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', onResize);
    }
  }

  updateTileInfo(tx, ty) {
    const info = this.sim.getTileInfo(tx, ty);
    const el = document.getElementById('tile-info');
    let html = `
      <p><span class="label">Position:</span> <span class="value">${info.x}, ${info.y}</span></p>
      <p><span class="label">Biome:</span> <span class="value">${info.biome}</span></p>
      <p><span class="label">Altitude:</span> <span class="value">${info.altitude}m</span></p>
      <p><span class="label">Temperature:</span> <span class="value">${info.temperature}&deg;C</span></p>
      <p><span class="label">Rainfall:</span> <span class="value">${info.rainfall}</span></p>
      <p><span class="label">Carrion:</span> <span class="value">${info.carrion}</span></p>
      <p><span class="label">Soil Nutrients:</span> <span class="value">${info.nutrients}</span></p>
      <p><span class="label">Animals here:</span> <span class="value">${info.creatureCount}</span></p>
      <div class="species-card" style="border-left:3px solid #66cc66;margin-top:8px">
        <div class="name" style="color:#66cc66">🌿 Plant community</div>
        <div class="stats">
          Biomass: ${info.plantBiomass} / ${info.maxBiomass} | Growth: ${info.growthRate}%<br>
          Defense: ${info.plant.defense}% | Toxicity: ${info.plant.toxicity}% | Drought: ${info.plant.drought}%
        </div>
      </div>
      <div class="species-card" style="border-left:3px solid #b070d0">
        <div class="name" style="color:#b070d0">🦠 Microbe community</div>
        <div class="stats">
          Biomass: ${info.microbe.biomass} | Decomp: ${info.microbe.decomp} | Chemo: ${info.microbe.chemo}%<br>
          Pathogenicity: ${info.microbe.pathogen}% | Symbiosis: ${info.microbe.symbiosis}%
        </div>
      </div>
    `;
    if (info.creatures.length > 0) {
      html += `<hr style="border-color:#0f3460;margin:8px 0">`;
      const stateName = ['Wander','Forage','Flee','Mate'];
      for (const c of info.creatures.slice(0, 8)) {
        const sp = this.sim.speciesMap.get(c.speciesId);
        const spName = sp ? sp.name : '?';
        const spCol = sp ? `rgb(${sp.color.join(',')})` : '#fff';
        const stage = c.pregnant ? 'Pregnant' : (isMature(c) ? 'Adult' : 'Juvenile');
        const def = [];
        if (c.pheno.armor > 0.4) def.push(`Armor ${(c.pheno.armor*100).toFixed(0)}%`);
        if (c.pheno.venom > 0.4) def.push(`Venom ${(c.pheno.venom*100).toFixed(0)}%`);
        if (c.pheno.pack  > 0.4) def.push(`Pack ${(c.pheno.pack*100).toFixed(0)}%`);
        if (c.pheno.display > 0.4) def.push(`Display ${(c.pheno.display*100).toFixed(0)}%`);
        if (c.pheno.scavenge > 0.4) def.push(`Scavenger ${(c.pheno.scavenge*100).toFixed(0)}%`);
        const healthTag = c.infected ? ' <span style="color:#ff3df0">🦠 sick</span>'
          : (c.resistant ? ' <span style="color:#40e0d0">immune</span>' : '');
        html += `<div class="species-card" style="border-left:3px solid ${spCol}">
          <div class="name" style="color:${spCol}">${sexSymbol(c.sex)} ${spName}${healthTag}</div>
          <div class="stats">
            ${dietLabel(c.pheno.diet)} ${stage} | Size: ${c.pheno.bodySize.toFixed(1)} | Age: ${c.age}/${Math.round(c.pheno.maxAge)}<br>
            Energy: ${c.energy.toFixed(1)} | Health: ${(c.health * 100).toFixed(0)}% | ${stateName[c.state || 0]}
            ${def.length ? '<br>' + def.join(' &middot; ') : ''}
          </div>
        </div>`;
      }
      if (info.creatures.length > 8) {
        html += `<p style="color:#a0a0c0;font-size:11px">...and ${info.creatures.length - 8} more</p>`;
      }
    }
    el.innerHTML = html;
  }

  updateSpeciesList() {
    const living = this.sim.getLivingSpecies();
    const el = document.getElementById('species-tab');
    let html = '';
    for (const sp of living.slice(0, 20)) {
      const avgGenome = sp.genome;
      const pheno = expressGene(avgGenome);
      const dietStr = dietLabel(pheno.diet);
      const col = `rgb(${sp.color.join(',')})`;

      html += `<div class="species-card" style="border-left:3px solid ${col}">
        <div class="name" style="color:${col}">${sp.name}</div>
        <div class="stats">
          ${dietStr} | Pop: ${sp.population} | Max: ${sp.maxPop} | Gen: ${sp.generation}<br>
          Born tick ${sp.birthTick} | Total born: ${sp.totalBorn}
        </div>`;

      // Gene bars
      for (let g = 0; g < CFG.NUM_GENES; g++) {
        const val = avgGenome[g];
        html += `<div class="gene-row">
          <span style="width:90px">${GENE_NAMES[g]}</span>
          <div class="gene-bar"><div class="gene-fill" style="width:${val * 100}%;background:${col}"></div></div>
          <span style="width:30px;text-align:right">${(val * 100).toFixed(0)}%</span>
        </div>`;
      }
      html += `</div>`;
    }

    // Extinct species summary
    const extinct = this.sim.species.filter(s => s.extinct);
    if (extinct.length > 0) {
      html += `<p style="color:#a0a0c0;font-size:12px;margin-top:8px">Extinct species: ${extinct.length}</p>`;
      for (const sp of extinct.slice(-5)) {
        html += `<p style="color:#606080;font-size:11px">${sp.name} - died tick ${sp.extinctTick}</p>`;
      }
    }

    el.innerHTML = html;
  }

  updateGraph() {
    const canvas = document.getElementById('pop-graph');
    if (canvas.parentElement.classList.contains('active')) {
      drawPopulationGraph(canvas, this.sim.history, this.sim.species);

      // Legend
      const legend = document.getElementById('graph-legend');
      legend.innerHTML = `
        <span class="legend-item"><span class="legend-dot" style="background:#e0e0e0"></span>Total</span>
        <span class="legend-item"><span class="legend-dot" style="background:#66cc66"></span>Herbivores</span>
        <span class="legend-item"><span class="legend-dot" style="background:#e94560"></span>Carnivores</span>
      `;
    }
  }

  updatePlanetInfo() {
    const el = document.getElementById('planet-info');
    if (!el) return;
    const p = this.sim.planet;
    const ws = this.sim.getWorldStatus();
    // Count average adaptation across the current population.
    let radSum = 0, toxSum = 0, photoSum = 0, immSum = 0, dispSum = 0, scavSum = 0, count = 0;
    for (const c of this.sim.creatures) {
      if (!c.alive) continue;
      radSum += c.pheno.radTol; toxSum += c.pheno.toxTol; photoSum += c.pheno.photosyn;
      immSum += c.pheno.immunity; dispSum += c.pheno.display; scavSum += c.pheno.scavenge;
      count++;
    }
    const avg = (s) => count ? (s / count * 100).toFixed(0) + '%' : '—';
    const st = ws.stats;
    const climate = ws.climateShift > 1 ? `+${ws.climateShift.toFixed(1)}°C (warming)`
      : ws.climateShift < -1 ? `${ws.climateShift.toFixed(1)}°C (cooling)` : 'stable';
    let eventsHtml = ws.events.slice(0, 5).map(e =>
      `<p style="color:#e0a0b0;font-size:11px;margin:2px 0">T${e.tick}: ${e.desc}</p>`).join('');
    if (!eventsHtml) eventsHtml = '<p style="color:#606080;font-size:11px">No catastrophes yet.</p>';
    el.innerHTML = `
      <div class="species-card" style="border-left:3px solid #e94560">
        <div class="name" style="color:#e94560">${p.name}</div>
        <div class="stats">
          ${p.star}<br>
          Atmosphere: ${p.atmosphere}<br>
          Solvent: ${p.solvent}<br>
          Gravity: ${p.gravity.toFixed(2)} g<br>
          Mean temp: ${p.meanTemp.toFixed(1)}&deg;C (&plusmn; ${(p.tempSpan/2).toFixed(0)})<br>
          Radiation: ${(p.radiation*100).toFixed(0)}%<br>
          Toxicity: ${(p.toxicity*100).toFixed(0)}%<br>
          Mutation: ${(p.mutation*100).toFixed(0)}%<br>
          Ocean fraction: ${(p.oceanFrac*100).toFixed(0)}%
        </div>
      </div>
      <div class="species-card" style="border-left:3px solid #66ccff">
        <div class="name" style="color:#66ccff">Climate &amp; Season</div>
        <div class="stats">
          Season: ${ws.season} (Year ${ws.year})<br>
          Climate trend: ${climate}<br>
          Infected now: ${ws.infected}
        </div>
      </div>
      <div class="species-card">
        <div class="name">Population adaptation</div>
        <div class="stats">
          Radiation tol: ${avg(radSum)} | Toxin tol: ${avg(toxSum)}<br>
          Photosynthesis: ${avg(photoSum)} | Immunity: ${avg(immSum)}<br>
          Display: ${avg(dispSum)} | Scavenging: ${avg(scavSum)}
        </div>
      </div>
      <div class="species-card">
        <div class="name">Causes of death (cumulative)</div>
        <div class="stats">
          Starvation: ${st.starved} | Predation: ${st.predated}<br>
          Old age: ${st.aged} | Disease: ${st.disease}<br>
          Climate: ${st.cold} | Births: ${st.births}
        </div>
      </div>
      <div class="species-card" style="border-left:3px solid #e0a0b0">
        <div class="name" style="color:#e0a0b0">Recent catastrophes</div>
        <div class="stats">${eventsHtml}</div>
      </div>`;
  }

  /// Flash a banner when a fresh catastrophe occurs, then fade it.
  updateEventBanner(ws) {
    const el = document.getElementById('event-banner');
    if (!el) return;
    const latest = ws.events[0];
    if (latest && latest.tick !== this._lastEventTick) {
      this._lastEventTick = latest.tick;
      this._eventShownAt = this.sim.tick;
      el.textContent = `⚠ Tick ${latest.tick}: ${latest.desc}`;
      el.classList.add('show');
    } else if (this._eventShownAt && this.sim.tick - this._eventShownAt > 400) {
      el.classList.remove('show');
    }
  }

  startLoop() {
    const loop = (timestamp) => {
      this.animId = requestAnimationFrame(loop);

      // Simulation steps
      if (!this.sim.paused) {
        for (let i = 0; i < this.speed; i++) {
          this.sim.step();
        }
      }

      // Render
      this.renderer.draw();

      // Update UI (throttled)
      if (timestamp - this.lastFrame > 500) {
        this.lastFrame = timestamp;
        document.getElementById('stat-tick').textContent = this.sim.tick;
        document.getElementById('stat-pop').textContent = this.sim.creatures.length;
        document.getElementById('stat-species').textContent =
          this.sim.species.filter(s => !s.extinct && s.population > 0).length;

        const ws = this.sim.getWorldStatus();
        document.getElementById('stat-season').textContent = `${ws.season} Y${ws.year}`;
        document.getElementById('stat-infected').textContent = ws.infected;
        this.updateEventBanner(ws);

        this.updateSpeciesList();
        this.updateGraph();
        this.updatePlanetInfo();

        if (this.sim.selectedTile) {
          this.updateTileInfo(this.sim.selectedTile[0], this.sim.selectedTile[1]);
        }
      }
    };
    requestAnimationFrame(loop);
  }
}

// ============================================================

window.addEventListener('load', () => {
  const app = new App();
  app.init();
});
</script>

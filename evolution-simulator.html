<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Evolution Ecosystem Simulator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1a2e;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-size:14px;touch-action:none;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom)}
#toolbar{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#16213e;border-bottom:1px solid #0f3460;flex-shrink:0;flex-wrap:wrap;z-index:10}
#toolbar button{padding:8px 14px;min-height:36px;border:1px solid #0f3460;background:#1a1a2e;color:#e0e0e0;border-radius:6px;font-size:13px;cursor:pointer;white-space:nowrap;touch-action:manipulation}
#toolbar button:active,#toolbar button.active{background:#0f3460;border-color:#e94560}
#toolbar select{padding:7px 8px;min-height:36px;border:1px solid #0f3460;background:#1a1a2e;color:#e0e0e0;border-radius:6px;font-size:13px;touch-action:manipulation}
#toolbar .sep{width:1px;height:24px;background:#0f3460;flex-shrink:0}
#toolbar label{font-size:12px;color:#a0a0c0}
#toolbar span.stat{font-size:12px;color:#e94560;font-weight:600}
#event-banner{display:none;padding:6px 12px;background:#3a1020;border-bottom:1px solid #e94560;color:#ffd0d8;font-size:12px;flex-shrink:0;z-index:9}
#event-banner.show{display:block;animation:flash 0.6s ease}
@keyframes flash{from{background:#e94560;color:#fff}to{background:#3a1020;color:#ffd0d8}}
#main-area{flex:1;display:flex;position:relative;overflow:hidden}
#canvas-wrap{flex:1;position:relative;overflow:hidden}
canvas{display:block;image-rendering:pixelated}
#sidebar{width:320px;background:#16213e;border-left:1px solid #0f3460;display:flex;flex-direction:column;overflow:hidden;transition:width .2s}
#sidebar.collapsed{width:0;border-left:none}
#sidebar-toggle{position:absolute;right:320px;top:50%;transform:translateY(-50%);z-index:5;background:#16213e;border:1px solid #0f3460;color:#e0e0e0;padding:8px 4px;border-radius:6px 0 0 6px;cursor:pointer;font-size:16px;transition:right .2s}
#sidebar-toggle.collapsed{right:0}
#tab-bar{display:flex;border-bottom:1px solid #0f3460;flex-shrink:0}
#tab-bar button{flex:1;padding:8px;border:none;background:transparent;color:#a0a0c0;font-size:12px;cursor:pointer;border-bottom:2px solid transparent}
#tab-bar button.active{color:#e94560;border-bottom-color:#e94560}
.tab-content{flex:1;overflow-y:auto;padding:10px;display:none}
.tab-content.active{display:block}
.species-card{background:#1a1a2e;border:1px solid #0f3460;border-radius:8px;padding:10px;margin-bottom:8px}
.species-card .name{font-weight:600;font-size:13px;margin-bottom:4px}
.species-card .stats{font-size:11px;color:#a0a0c0;line-height:1.6}
.species-card .bar{height:4px;background:#0f3460;border-radius:2px;margin:2px 0}
.species-card .bar-fill{height:100%;border-radius:2px}
.gene-row{display:flex;justify-content:space-between;align-items:center;font-size:11px;margin:2px 0}
.gene-row .gene-bar{flex:1;height:4px;background:#0f3460;border-radius:2px;margin:0 6px}
.gene-row .gene-fill{height:100%;border-radius:2px;background:#e94560}
#tile-info{font-size:12px;line-height:1.8}
#tile-info .label{color:#a0a0c0}
#tile-info .value{color:#e0e0e0;font-weight:600}
#pop-graph{width:100%;height:200px;background:#1a1a2e;border:1px solid #0f3460;border-radius:6px}
#minimap{width:100%;height:60px;border:1px solid #0f3460;border-radius:6px;margin-bottom:8px;cursor:pointer}
.legend-item{display:inline-flex;align-items:center;gap:4px;margin:2px 6px 2px 0;font-size:11px}
.legend-dot{width:10px;height:10px;border-radius:50%;display:inline-block}
#speed-slider{width:80px;accent-color:#e94560}
#loading{position:fixed;inset:0;background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100}
#loading h1{color:#e94560;font-size:24px;margin-bottom:10px}
#loading .bar-outer{width:260px;height:8px;background:#0f3460;border-radius:4px;overflow:hidden}
#loading .bar-inner{height:100%;background:#e94560;border-radius:4px;transition:width .3s}
#loading p{margin-top:8px;color:#a0a0c0;font-size:13px}
#sidebar-toggle{min-width:28px;min-height:48px}
#sidebar-backdrop{position:absolute;inset:0;background:rgba(10,10,20,0.55);z-index:15;display:none}
#sidebar-backdrop.show{display:block}
@media(max-width:768px){
  #sidebar{width:280px}
  #sidebar-toggle{right:280px}
  #sidebar-toggle.collapsed{right:0}
}
@media(max-width:600px){
  #sidebar{position:absolute;right:0;top:0;bottom:0;z-index:20;width:min(85vw,320px)}
  #sidebar.collapsed{width:0}
  #sidebar-toggle{right:min(85vw,320px);z-index:21;padding:12px 6px}
  #sidebar-toggle.collapsed{right:0}
  #toolbar{gap:6px;padding:5px 8px}
  #toolbar button{padding:8px 10px;font-size:12px}
  #toolbar select{padding:7px 6px;font-size:12px;max-width:42vw}
  /* Drop auxiliary labels on small screens; the selects next to them make
     their meaning obvious. */
  #toolbar label[data-compact-hide]{display:none}
  #toolbar .sep{height:20px}
  /* Shrink decorative separators when wrapping gets crowded. */
  #tab-bar button{padding:10px 4px;font-size:11px}
  #speed-slider{width:70px}
}
@media(max-width:400px){
  #toolbar{gap:4px;padding:4px 6px}
  #toolbar button{padding:8px;font-size:12px}
  #toolbar span.stat{font-size:11px}
  #sidebar{width:min(92vw,320px)}
  #sidebar-toggle{right:min(92vw,320px)}
  #tab-bar button{padding:10px 2px;font-size:10px}
}
@media(orientation:landscape) and (max-height:480px){
  #toolbar{padding:3px 8px;gap:6px}
  #toolbar button{padding:6px 10px;min-height:30px;font-size:12px}
  #toolbar select{padding:5px 6px;min-height:30px;font-size:12px}
}
</style>
</head>
<body>
<div id="loading">
  <h1>Evolution Simulator</h1>
  <div class="bar-outer"><div class="bar-inner" id="load-bar" style="width:0%"></div></div>
  <p id="load-text">Initializing...</p>
</div>
<div id="app" style="display:none">
  <div id="toolbar">
    <button id="btn-pause">Pause</button>
    <div class="sep"></div>
    <label data-compact-hide>Speed</label>
    <input type="range" id="speed-slider" min="1" max="20" value="3" aria-label="Simulation speed">
    <div class="sep"></div>
    <label data-compact-hide>View</label>
    <select id="view-select" aria-label="View mode">
      <option value="biome">Biomes</option>
      <option value="altitude">Altitude</option>
      <option value="temperature">Temperature</option>
      <option value="rainfall">Rainfall</option>
      <option value="plants">Plants</option>
      <option value="microbes">Microbes</option>
      <option value="carrion">Carrion</option>
      <option value="nutrients">Nutrients</option>
      <option value="disease">Disease</option>
    </select>
    <div class="sep"></div>
    <button id="btn-creatures" class="active" aria-label="Toggle creature rendering">Creatures</button>
    <div class="sep"></div>
    <label data-compact-hide>Planet</label>
    <select id="planet-select" aria-label="Planet preset"></select>
    <div class="sep"></div>
    <span class="stat">T:<span id="stat-tick">0</span></span>
    <span class="stat">Pop:<span id="stat-pop">0</span></span>
    <span class="stat">Sp:<span id="stat-species">0</span></span>
    <span class="stat" title="Season">❄<span id="stat-season">—</span></span>
    <span class="stat" title="Infected">🦠<span id="stat-infected">0</span></span>
    <div class="sep"></div>
    <button id="btn-new">New</button>
  </div>
  <div id="event-banner"></div>
  <div id="main-area">
    <div id="canvas-wrap">
      <canvas id="world-canvas"></canvas>
    </div>
    <div id="sidebar-backdrop"></div>
    <button id="sidebar-toggle" aria-label="Toggle sidebar">&lsaquo;</button>
    <div id="sidebar">
      <div id="tab-bar">
        <button class="active" data-tab="species-tab">Species</button>
        <button data-tab="planet-tab">Planet</button>
        <button data-tab="tile-tab">Tile Info</button>

      <div id="planet-tab" class="tab-content">
        <div id="planet-info"><p style="color:#a0a0c0">No planet loaded.</p></div>
      </div>
      <div id="tile-tab" class="tab-content">
        <div id="tile-info"><p style="color:#a0a0c0">Tap a tile on the map to see details.</p></div>
      </div>
      <div id="graph-tab" class="tab-content">
        <canvas id="pop-graph"></canvas>
        <div id="graph-legend" style="margin-top:6px"></div>
      </div>
    </div>
  </div>
</div>

<script>
"use strict";

// ============================================================
// CONFIGURATION
// ============================================================

// ---- ANIMAL gene indices (kingdom: Animalia) ----
const G = {

  LONGEVITY:8, FERTILITY:9, OFFSPRING:10, EFFICIENCY:11,

  RAD_TOL:14, TOX_TOL:15, PRESS_TOL:16, PHOTOSYN:17,
  MATURITY:18, ARMOR:19, VENOM:20, PACK:21,
  IMMUNITY:22, DISPLAY:23, SCAVENGE:24, METABOLISM:25,
  // new realistic traits
  THERMOREG:26,   // 0 = ectotherm (cheap, cold-sluggish), 1 = endotherm (warm-blooded, costly)
  INTELLIGENCE:27,// better foraging & predator evasion, costly brain
  DIGESTION:28,   // gut efficiency: more energy from food, but diet-specialised
  GROWTH_RATE:29  // juvenile growth speed (size attained), trades against longevity
};

const GENE_NAMES = [
  "Body Size","Speed","Sense Range","Diet",
  "Cold Tolerance","Heat Tolerance","Camouflage","Aggression",
  "Longevity","Fertility","Offspring Count","Efficiency",
  "Water Need","Leg Strength",
  "Radiation Tolerance","Toxic Tolerance","Pressure Tolerance","Photosynthesis",

  "Immunity","Display","Scavenging","Metabolism",
  "Thermoregulation","Intelligence","Digestion","Growth Rate"
];

// ---- PLANT gene indices (kingdom: Plantae — per-tile community) ----
const PG = {
  GROWTH:0,     // intrinsic productivity
  CAPACITY:1,   // standing biomass ceiling (height/density)
  DEFENSE:2,    // physical toughness: reduces herbivore intake
  TOXICITY:3,   // chemical defense: poisons grazers lacking detox
  COLD_TOL:4,   // planet-relative cold edge
  HEAT_TOL:5,   // planet-relative hot edge
  DROUGHT:6,    // tolerance of low precipitation
  DISPERSAL:7,  // how fast it colonises neighbouring tiles
  ROOTING:8     // nutrient-uptake efficiency from soil
};
const PLANT_GENE_NAMES = ["Growth","Capacity","Defense","Toxicity","Cold Tol","Heat Tol","Drought","Dispersal","Rooting"];

// ---- MICROBE gene indices (kingdom: Microbiota — per-tile community) ----
const MG = {
  DECOMP:0,     // decomposition rate: carrion -> soil nutrients
  CHEMO:1,      // chemosynthesis: primary production without sunlight
  PATHOGEN:2,   // virulence: seeds animal disease
  TOLERANCE:3,  // survives temperature / chemical extremes
  SYMBIOSIS:4   // mutualism: boosts plant growth (N-fixation / mycorrhizae)
};
const MICROBE_GENE_NAMES = ["Decomposition","Chemosynthesis","Pathogenicity","Tolerance","Symbiosis"];

// ============================================================
// PLANET PRESETS — pick which world you want to evolve life on.
// Each preset retunes the physical envelope (temperature, ocean fraction,
// radiation, gravity) and the evolutionary pressures that follow.
// ============================================================
const PLANETS = [
  { id:"earthlike",  name:"Earthlike",
    star:"G-class Sun-like",  atmosphere:"O2 / N2",   solvent:"Liquid water",

    oceanFrac:0.05, mutation:1.1, oceanColor:[120,90,60], solar:0.85 },
  { id:"ocean",      name:"Ocean World",
    star:"G-class Sun-like",  atmosphere:"O2 / N2",   solvent:"Liquid water",

  { id:"bluehot",    name:"Blue-Giant Hothouse",

    gravity:1.30, meanTemp:35.0, tempSpan:55,  radiation:0.60, toxicity:0.25,

    gravity:0.80, meanTemp:-10.0, tempSpan:120, radiation:0.45, toxicity:0.00,

const DEFAULT_PLANET = PLANETS[0];

// ============================================================
// PERLIN NOISE (Classic 2D)
// ============================================================
class Perlin {
  constructor(seed) {
    this.p = new Uint8Array(512);
    const perm = new Uint8Array(256);
    for (let i = 0; i < 256; i++) perm[i] = i;
    let s = seed | 0;
    for (let i = 255; i > 0; i--) {
      s = (s * 1103515245 + 12345) & 0x7fffffff;
      const j = s % (i + 1);
      [perm[i], perm[j]] = [perm[j], perm[i]];
    }
    for (let i = 0; i < 512; i++) this.p[i] = perm[i & 255];
  }
  fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
  lerp(a, b, t) { return a + t * (b - a); }
  grad(hash, x, y) {
    const h = hash & 3;
    const u = h < 2 ? x : -x;
    const v = h === 0 || h === 3 ? y : -y;
    return u + v;
  }
  noise(x, y) {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
    const xf = x - Math.floor(x), yf = y - Math.floor(y);
    const u = this.fade(xf), v = this.fade(yf);
    const p = this.p;
    const aa = p[p[X] + Y], ab = p[p[X] + Y + 1];
    const ba = p[p[X + 1] + Y], bb = p[p[X + 1] + Y + 1];
    return this.lerp(
      this.lerp(this.grad(aa, xf, yf), this.grad(ba, xf - 1, yf), u),
      this.lerp(this.grad(ab, xf, yf - 1), this.grad(bb, xf - 1, yf - 1), u),
      v
    );
  }
  octave(x, y, octaves, persistence, scale) {
    let total = 0, freq = scale, amp = 1, maxAmp = 0;
    for (let i = 0; i < octaves; i++) {
      total += this.noise(x * freq, y * freq) * amp;
      maxAmp += amp;
      amp *= persistence;
      freq *= 2;
    }
    return total / maxAmp;
  }
}

// ============================================================
// SEEDED RNG (Xoshiro128**)
// ============================================================
class RNG {
  constructor(seed) {
    let s = seed | 0;
    this.s = new Uint32Array(4);
    for (let i = 0; i < 4; i++) {
      s = (s * 1664525 + 1013904223) | 0;
      this.s[i] = s >>> 0;
    }
  }
  next() {
    const s = this.s;
    const result = (s[1] * 5) | 0;
    const t = s[1] << 9;
    s[2] ^= s[0]; s[3] ^= s[1]; s[1] ^= s[2]; s[0] ^= s[3];
    s[2] ^= t; s[3] = (s[3] << 11) | (s[3] >>> 21);
    return (result >>> 0) / 4294967296;
  }
  range(min, max) { return min + this.next() * (max - min); }
  int(min, max) { return Math.floor(this.range(min, max)); }
  chance(p) { return this.next() < p; }
}

// ============================================================
// BIOME DEFINITIONS
// ============================================================
// Each biome sets the physical stage: a base plant carrying capacity
// (maxBio) and productivity (growth) that plant communities evolve within,
// whether it is aquatic (animals can't colonise open liquid), and whether
// it supports chemosynthesis (microbe-driven primary production with no
// sunlight, as at deep-sea / geothermal vents).
const BIOMES = {
  OCEAN:        {id:0,  name:"Ocean",          color:[30,60,120],   growth:0,    maxBio:0,   aquatic:true,  chemo:false},

  RAINFOREST:   {id:7,  name:"Rainforest",     color:[20,90,35],    growth:1.00, maxBio:120, aquatic:false, chemo:false},
  // --- alien / extreme biomes ---
  AMMONIA_SEA:  {id:8,  name:"Ammonia Sea",    color:[82,110,122],  growth:0,    maxBio:0,   aquatic:true,  chemo:false},
  METHANE_LAKE: {id:9,  name:"Methane Lake",   color:[60,42,30],    growth:0,    maxBio:0,   aquatic:true,  chemo:false},
  SULFURIC_SEA: {id:10, name:"Sulfuric Sea",   color:[168,142,90],  growth:0,    maxBio:0,   aquatic:true,  chemo:false},
  LAVA_FIELD:   {id:11, name:"Lava Field",     color:[150,55,30],   growth:0,    maxBio:0,   aquatic:false, chemo:false, barren:true},
  CRYO_PLAIN:   {id:12, name:"Cryo Plain",     color:[180,200,220], growth:0.04, maxBio:8,   aquatic:false, chemo:false},
  CRYSTAL_FOREST:{id:13,name:"Crystal Forest", color:[168,130,210], growth:0.40, maxBio:55,  aquatic:false, chemo:false},
  FUNGAL_MAT:   {id:14, name:"Fungal Mat",     color:[120,70,140],  growth:0.70, maxBio:85,  aquatic:false, chemo:true},
  GEO_VENT:     {id:15, name:"Geothermal Vent",color:[110,60,40],   growth:0.35, maxBio:50,  aquatic:false, chemo:true},
  SILICA_DESERT:{id:16, name:"Silica Desert",  color:[220,200,230], growth:0.02, maxBio:4,   aquatic:false, chemo:false},
  HAZE_HIGHLAND:{id:17, name:"Haze Highland",  color:[180,160,120], growth:0.18, maxBio:24,  aquatic:false, chemo:false}
};
const BIOME_LIST = Object.values(BIOMES);

// Pick the open-liquid biome that matches the planet's solvent.
function oceanBiomeFor(planet) {
  const s = planet && planet.solvent ? planet.solvent : "Liquid water";
  if (s.indexOf("ammonia") >= 0) return BIOMES.AMMONIA_SEA;
  if (s.indexOf("methane") >= 0) return BIOMES.METHANE_LAKE;
  if (s.indexOf("ulfuric") >= 0) return BIOMES.SULFURIC_SEA;
  if (s.indexOf("Dry") >= 0 || s.indexOf("frozen") >= 0) return BIOMES.SILICA_DESERT;
  return BIOMES.OCEAN;
}

// Planet-aware biome classification. Oceans take the solvent's biome; land
// biomes depend on the planet's atmosphere chemistry and the local climate,
// expressed relative to the planet's own mean temperature.
function classifyBiome(alt, rain, temp, planet) {
  if (alt < 0) return oceanBiomeFor(planet);

  const mean = (planet && planet.meanTemp !== undefined) ? planet.meanTemp : 0;
  const atm = (planet && planet.atmosphere) ? planet.atmosphere : "O2 / N2";
  const oxygen = atm.indexOf("O2") >= 0;
  const reducing = (atm.indexOf("Methane") >= 0 || atm.indexOf("Ammonia") >= 0);
  const sulfuric = atm.indexOf("Sulfuric") >= 0;
  const rel = temp - mean;

  // Extreme heat scorches land into lava/silica regardless of chemistry.
  if (temp > 45 && rel > 8) return BIOMES.LAVA_FIELD;
  // Deep cold.
  if (rel < -14) return oxygen ? BIOMES.ICE_CAP : BIOMES.CRYO_PLAIN;

  if (sulfuric) {
    // Acid world: sparse crystalline/haze cover.
    if (rain < 300) return BIOMES.SILICA_DESERT;
    return BIOMES.HAZE_HIGHLAND;
  }
  if (reducing) {
    // Reducing atmospheres host fungal/chemotrophic mats where it's wet,
    // crystal scrub where it's dry.
    if (rain > 900) return BIOMES.FUNGAL_MAT;
    if (rel < -2) return BIOMES.CRYO_PLAIN;
    return (rain < 300) ? BIOMES.SILICA_DESERT : BIOMES.CRYSTAL_FOREST;
  }
  if (!oxygen) {
    // Thick CO2 / trace: tougher analogues of the temperate biomes.
    if (rel < -2) return BIOMES.HAZE_HIGHLAND;
    if (rain < 300) return BIOMES.SILICA_DESERT;
    if (rain < 1400) return BIOMES.CRYSTAL_FOREST;
    return BIOMES.FUNGAL_MAT;
  }

  // Oxygen world — familiar Earthlike biomes.
  if (rel < -2) {
    if (rain < 725) return BIOMES.TUNDRA;
    return BIOMES.TAIGA;
  }
  if (rain < 275) return BIOMES.DESERT;
  if (rain < 1375) return BIOMES.GRASSLAND;
  if (rain < 1775) return BIOMES.FOREST;
  return BIOMES.RAINFOREST;
}

// ============================================================
// WORLD GENERATION
// ============================================================
class World {
  constructor(seed, planet) {
    this.seed = seed;
    this.planet = planet || DEFAULT_PLANET;
    this.W = CFG.W;
    this.H = CFG.H;
    this.altitude = new Float32Array(this.W * this.H);
    this.temperature = new Float32Array(this.W * this.H);
    this.rainfall = new Float32Array(this.W * this.H);
    this.biome = new Uint8Array(this.W * this.H);
    this.continents = [];
    this.generate();
  }

  idx(x, y) { return y * this.W + x; }

  generate() {
    const rng = new RNG(this.seed);
    const p1 = new Perlin(this.seed);
    const p2 = new Perlin(this.seed + 1000);
    const p3 = new Perlin(this.seed + 2000);

    // Place continents
    this.continents = [];
    for (let i = 0; i < CFG.NUM_CONTINENTS; i++) {
      this.continents.push({
        x: rng.range(0.1, 0.9) * this.W,
        y: rng.range(0.15, 0.85) * this.H,
        size: rng.range(CFG.CONT_MIN_SIZE, CFG.CONT_MAX_SIZE)
      });
    }

    // Stage 1: Altitude
    for (let y = 0; y < this.H; y++) {
      for (let x = 0; x < this.W; x++) {
        const i = this.idx(x, y);

        // Continent influence
        let contInfluence = 0;
        for (const c of this.continents) {
          let dx = Math.abs(x - c.x);
          if (dx > this.W / 2) dx = this.W - dx; // wrap
          const dy = y - c.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const norm = dist / c.size;
          if (norm < 3.0) {
            contInfluence += Math.exp(-norm * norm * 0.5);
          }
        }
        contInfluence = Math.min(contInfluence, 1.5);

        // Noise layers
        const nx = x / this.W, ny = y / this.H;
        const macro = p1.octave(nx, ny, 4, 0.5, 3.0);
        const meso = p2.octave(nx, ny, 6, 0.55, 8.0);
        const micro = p3.octave(nx, ny, 3, 0.4, 32.0);

        // Mountain ridges
        const ridge = Math.exp(-Math.pow(meso * 2.5, 2)) * 0.3;

        let alt = (contInfluence * 0.22 + macro * 0.15 + meso * 0.1 + ridge) * 15000;
        alt += micro * 1500;

        // Edge dampening (poles)
        const edgeFactor = Math.sin(ny * Math.PI);
        alt *= (0.3 + 0.7 * edgeFactor);

        // Shift sea level to hit the planet's target ocean fraction.
        // oceanFrac=0.5 keeps the historical baseline (-4500 shift).
        const seaShift = -4500 + (0.5 - this.planet.oceanFrac) * 9000;
        alt = Math.max(-15000, Math.min(15000, alt + seaShift));
        this.altitude[i] = alt;
      }
    }

    // Stage 2: Rainfall
    for (let y = 0; y < this.H; y++) {
      for (let x = 0; x < this.W; x++) {
        const i = this.idx(x, y);
        const nx = x / this.W, ny = y / this.H;

        const r1 = p2.octave(nx + 5, ny + 5, 3, 0.5, 2.0);
        const r2 = p3.octave(nx + 10, ny + 10, 2, 0.4, 16.0);

        // Latitude modulation (equator wetter)
        const latFactor = Math.sin(ny * Math.PI);

        // Orographic effect
        let oroBoost = 0;
        const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
        for (const [ddx, ddy] of dirs) {
          const nx2 = (x + ddx + this.W) % this.W;
          const ny2 = Math.max(0, Math.min(this.H - 1, y + ddy));
          const dAlt = this.altitude[this.idx(nx2, ny2)] - this.altitude[i];
          if (dAlt > 0) oroBoost += dAlt * 0.0004;
        }

        let rain = (0.5 + r1 * 0.3 + r2 * 0.1) * latFactor * 13000;
        rain += oroBoost * 5000;

        // Coast proximity bonus
        if (this.altitude[i] > 0 && this.altitude[i] < 2000) {
          rain *= 1.15;
        }

        this.rainfall[i] = Math.max(0, Math.min(13000, rain));
      }
    }

    // Stage 3: Temperature — driven by the planet's mean & span.
    const tMean = this.planet.meanTemp;
    const tSpan = this.planet.tempSpan;
    const tMin = tMean - tSpan * 0.5;
    const tMax = tMean + tSpan * 0.5;
    for (let y = 0; y < this.H; y++) {
      for (let x = 0; x < this.W; x++) {
        const i = this.idx(x, y);
        const ny = y / this.H;
        const nx = x / this.W;

        // Latitude (equator warm, poles cold) in planet-relative terms.
        const latTemp = tMean + (Math.sin(ny * Math.PI) - 0.5) * tSpan;
        const noise = p1.octave(nx + 20, ny + 20, 2, 0.5, 2.0) * tSpan * 0.05;
        const altReduction = Math.max(0, this.altitude[i]) / 1000 * CFG.TEMP_ALT_FACTOR
          * (tSpan / 65);

        this.temperature[i] = Math.max(tMin, Math.min(tMax, latTemp + noise - altReduction));
      }
    }

    // Stage 4: Biome classification
    for (let y = 0; y < this.H; y++) {
      for (let x = 0; x < this.W; x++) {
        const i = this.idx(x, y);
        this.biome[i] = classifyBiome(
          this.altitude[i], this.rainfall[i], this.temperature[i], this.planet
        ).id;
      }
    }
  }

  isHabitable(x, y) {
    // Animals live on solid land that isn't a barren ice cap or lava field;
    // open liquid and barren extremes exclude them (microbes still live there).
    const b = BIOME_LIST[this.biome[this.idx(x, y)]];
    return !b.aquatic && !b.barren;
  }

  getBiome(x, y) { return BIOME_LIST[this.biome[this.idx(x, y)]]; }
}

// ============================================================
// GENETICS
// ============================================================
function expressGene(genes) {
  return {
    bodySize:     0.2 + genes[G.BODY_SIZE] * 4.8,
    speed:        0.3 + genes[G.SPEED] * 2.7,
    senseRange:   1.0 + genes[G.SENSE_RANGE] * 7.0,
    diet:         genes[G.DIET],
    coldTol:      -35 + genes[G.COLD_TOL] * 40,
    heatTol:      -5 + genes[G.HEAT_TOL] * 35,
    coldGene:     genes[G.COLD_TOL],   // raw 0..1, mapped to the planet's range in stress
    heatGene:     genes[G.HEAT_TOL],
    camouflage:   genes[G.CAMOUFLAGE],
    aggression:   genes[G.AGGRESSION],
    maxAge:       50 + genes[G.LONGEVITY] * 450,
    fertility:    30 + genes[G.FERTILITY] * 70,
    offspringCnt: Math.round(1 + genes[G.OFFSPRING] * 3),
    efficiency:   0.5 + genes[G.EFFICIENCY] * 1.5,
    waterNeed:    genes[G.WATER_NEED],
    legStrength:  genes[G.LEG_STRENGTH],
    radTol:       genes[G.RAD_TOL] || 0,
    toxTol:       genes[G.TOX_TOL] || 0,
    pressTol:     genes[G.PRESS_TOL] || 0,
    photosyn:     genes[G.PHOTOSYN] || 0,
    // Age in ticks at which this creature becomes a reproductive adult.
    // Late-maturing animals invest more in growth and end up tougher.
    maturityAge:  Math.round(5 + (genes[G.MATURITY] || 0) * 45),
    armor:        genes[G.ARMOR] || 0,    // 0..1, reduces incoming damage
    venom:        genes[G.VENOM] || 0,    // 0..1, hurts attackers
    pack:         genes[G.PACK]  || 0,    // 0..1, gain when grouped
    // --- realism traits ---
    immunity:     genes[G.IMMUNITY] || 0, // 0..1, resists & clears disease
    display:      genes[G.DISPLAY]  || 0, // 0..1, sexual ornament; attracts mates, attracts predators
    scavenge:     genes[G.SCAVENGE] || 0, // 0..1, efficiency feeding on carrion
    // Metabolic tempo: fast burners are quicker & breed sooner but starve
    // faster; slow burners are hardy and frugal. Centered near 1.0.
    metabolism:   0.6 + (genes[G.METABOLISM] !== undefined ? genes[G.METABOLISM] : 0.5) * 0.9,
    // --- detailed physiology ---
    // Endothermy: warm-blooded animals stay active and resist cold but pay a
    // higher resting metabolic cost (the classic ecto/endotherm trade-off).
    thermoreg:    genes[G.THERMOREG]    !== undefined ? genes[G.THERMOREG]    : 0,
    intelligence: genes[G.INTELLIGENCE] !== undefined ? genes[G.INTELLIGENCE] : 0,
    digestion:    genes[G.DIGESTION]    !== undefined ? genes[G.DIGESTION]    : 0.5,
    growthRate:   genes[G.GROWTH_RATE]  !== undefined ? genes[G.GROWTH_RATE]  : 0.5
  };
}

// ---- Plant community expression. Tolerances are planet-relative (mapped in
// the flora update), so plants can adapt to any world's temperature band. ----
function expressPlant(genes) {
  return {
    growth:    0.2 + genes[PG.GROWTH] * 1.6,      // productivity multiplier
    capacity:  0.3 + genes[PG.CAPACITY] * 1.4,    // ceiling multiplier on biome maxBio
    defense:   genes[PG.DEFENSE],                 // 0..1 reduces grazing
    toxicity:  genes[PG.TOXICITY],                // 0..1 poisons unadapted grazers
    coldGene:  genes[PG.COLD_TOL],
    heatGene:  genes[PG.HEAT_TOL],
    drought:   genes[PG.DROUGHT],
    dispersal: genes[PG.DISPERSAL],
    rooting:   genes[PG.ROOTING]
  };
}

// ---- Microbe community expression. ----
function expressMicrobe(genes) {
  return {
    decomp:    0.2 + genes[MG.DECOMP] * 1.6,
    chemo:     genes[MG.CHEMO],
    pathogen:  genes[MG.PATHOGEN],
    tolerance: genes[MG.TOLERANCE],
    symbiosis: genes[MG.SYMBIOSIS]
  };
}

function randomKingdomGenome(rng, n, lo, hi) {
  const g = new Float32Array(n);
  for (let i = 0; i < n; i++) g[i] = rng.range(lo, hi);
  return g;
}

// Mutate a per-tile community genome in place-ish (returns a mutated copy).
function mutateGenome(src, n, rate, rng) {
  const g = new Float32Array(src);
  for (let i = 0; i < n; i++) {
    if (rng.chance(rate)) g[i] = Math.max(0, Math.min(1, g[i] + rng.range(-0.12, 0.12)));
  }
  return g;
}

// Diet-based food preferences. Pure herbivores (diet<0.4) graze; pure
// carnivores (diet>0.6) hunt; omnivores do both, prioritising whichever
// is more abundant.
function isHerbivore(p) { return p.diet < 0.4; }
function isCarnivore(p) { return p.diet > 0.6; }
// Fast growers reach breeding size sooner (growthRate gene, default 0.5 = neutral).
function maturityOf(c) { return c.pheno.maturityAge * (1.3 - c.pheno.growthRate * 0.6); }
function isMature(c)    { return c.age >= maturityOf(c); }

function crossover(a, b, rng, mutationScale) {
  mutationScale = mutationScale || 1;
  const child = new Float32Array(CFG.NUM_GENES);
  const split = rng.int(1, CFG.NUM_GENES - 1);
  const mRate = Math.min(0.9, CFG.MUTATION_RATE * mutationScale);
  const mAmt = Math.min(0.6, CFG.MUTATION_AMOUNT * mutationScale);
  for (let i = 0; i < CFG.NUM_GENES; i++) {
    if (i < split) child[i] = a[i]; else child[i] = b[i];
    if (rng.chance(CFG.BLEND_CHANCE)) {
      child[i] = (a[i] + b[i]) * 0.5;
    }
    if (rng.chance(mRate)) {
      child[i] += rng.range(-mAmt, mAmt);
    }
    child[i] = Math.max(0, Math.min(1, child[i]));
  }
  return child;
}

function geneticDistance(a, b) {
  let sum = 0;
  for (let i = 0; i < CFG.NUM_GENES; i++) {
    const d = a[i] - b[i];
    sum += d * d;
  }
  return Math.sqrt(sum / CFG.NUM_GENES);
}

function randomGenome(rng, base, variance) {
  const g = new Float32Array(CFG.NUM_GENES);
  for (let i = 0; i < CFG.NUM_GENES; i++) {
    g[i] = Math.max(0, Math.min(1, base[i] + rng.range(-variance, variance)));
  }
  return g;
}

// Pre-adapt a founding lineage's climate & planetary-tolerance genes to the
// world it's seeded on, so colonists aren't all instantly killed by the
// ambient conditions. Real founder populations are already broadly suited to
// their environment; selection then refines them. Mutates `base` in place.
function adaptBaseToPlanet(base, planet, rng) {
  // Thermal tolerance is now expressed relative to the planet's own range
  // (see the stress step), so founders just need to be broad generalists that
  // span their world: cold-hardy at the low edge, heat-hardy at the high edge.
  base[G.COLD_TOL] = rng.range(0.1, 0.3);  // low gene ⇒ tolerates the cold edge
  base[G.HEAT_TOL] = rng.range(0.7, 0.9);  // high gene ⇒ tolerates the hot edge
  base[G.RAD_TOL]  = Math.max(0, Math.min(1, planet.radiation * 0.8 + rng.range(0, 0.25)));
  base[G.TOX_TOL]  = Math.max(0, Math.min(1, planet.toxicity * 0.7 + rng.range(0, 0.3)));
  const pNorm = Math.max(0, Math.min(1, planet.gravity / 3));
  base[G.PRESS_TOL] = Math.max(0, Math.min(1, pNorm * 0.7 + rng.range(0, 0.3)));
  if (planet.oceanFrac < 0.2) base[G.WATER_NEED] = rng.range(0.5, 0.9); // drought-adapted
  base[G.IMMUNITY] = rng.range(0.3, 0.6); // founders carry a baseline immune system
  // Cold worlds favour warm-blooded founders; otherwise a mix of strategies.
  base[G.THERMOREG] = planet.meanTemp < 0 ? rng.range(0.4, 0.7) : rng.range(0.1, 0.5);
  base[G.DIGESTION] = rng.range(0.4, 0.7);
  base[G.GROWTH_RATE] = rng.range(0.4, 0.7);
}

function dietLabel(d) {
  if (d < 0.35) return "Herbivore";
  if (d <= 0.65) return "Omnivore";
  return "Carnivore";
}

let nextSpeciesId = 0;
class Species {
  constructor(name, color, representativeGenome) {
    this.id = nextSpeciesId++;
    this.name = name;
    this.color = color;
    this.genome = new Float32Array(representativeGenome);
    this.population = 0;
    this.totalBorn = 0;
    this.totalDied = 0;
    this.generation = 0;
    this.maxPop = 0;
    this.birthTick = 0;
    this.extinct = false;
    this.extinctTick = -1;
  }
}

const SPECIES_COLORS = [
  [230,69,96],[69,162,230],[100,210,100],[230,180,50],[180,100,230],
  [230,130,60],[60,210,190],[210,80,180],[140,200,60],[80,140,230],
  [230,100,100],[100,230,200],[200,200,60],[160,60,200],[60,180,120],
  [230,150,150],[100,180,230],[180,230,100],[230,200,150],[150,100,180]
];

const SPECIES_PREFIXES = ["Archi","Neo","Proto","Mega","Micro","Para","Pseudo","Ultra","Macro","Mini"];
const SPECIES_ROOTS = ["saurus","therium","raptor","don","phyte","zoon","ptera","ceryx","gator","vora"];
const SPECIES_SUFFIXES = ["us","is","ax","or","ix","um","a","ens","oides","alis"];

function generateSpeciesName(rng) {

         SPECIES_ROOTS[rng.int(0, SPECIES_ROOTS.length)] +

}

// ============================================================
// CREATURE
// ============================================================
// Behavioural state — determines what the creature is currently trying
// to do. Set each tick by chooseGoal(), used by movement & combat.
const STATE = { WANDER:0, SEEK_FOOD:1, FLEE:2, SEEK_MATE:3 };

class Creature {
  constructor(x, y, genes, speciesId, sex) {
    this.x = x;
    this.y = y;
    this.genes = genes;
    this.pheno = expressGene(genes);
    this.speciesId = speciesId;
    // Sex is binary and assigned at birth via a coin-flip; kept on the
    // creature rather than the genome so siblings can be different sexes.
    this.sex = (sex !== undefined) ? sex : (Math.random() < 0.5 ? 0 : 1);
    this.energy = this.pheno.fertility * 0.8;
    this.health = 1.0;
    this.age = 0;
    this.alive = true;
    // Juveniles need to grow up before they can breed.
    this.breedCooldown = Math.max(20, this.pheno.maturityAge);
    this.targetX = x;
    this.targetY = y;
    this.moveTimer = 0;
    this.state = STATE.WANDER;
    this.lastAttackerId = -1; // for venom retaliation tracking
    // --- realism state ---
    this.infected = false;    // currently carrying a disease
    this.infectTimer = 0;     // ticks remaining in the current infection
    this.resistant = false;   // acquired immunity after surviving an infection
    this.pregnant = false;    // females gestate before giving birth
    this.gestation = 0;       // ticks remaining until birth
    this.matePheno = null;    // father's genome, stored at conception
    this.mateGenes = null;
    this.deathCause = null;   // tagged when the creature dies, for stats/carrion
  }
}
// Symbol used in the UI for the creature's sex.
function sexSymbol(s) { return s === 0 ? '♀' : '♂'; }

// ============================================================
// TILE ECOSYSTEM
// ============================================================
// A tile hosts three kingdoms: a plant community (Plantae), a microbe
// community (Microbiota), and visiting animals (Animalia, stored separately).
// Plants and microbes are modelled as evolving per-tile populations rather
// than individuals, which keeps the three-kingdom ecology affordable.
class TileEco {
  constructor(biome, planet, rng) {
    this.biomeId = biome.id;
    this.baseGrowth = biome.growth;
    this.baseCap = biome.maxBio;
    this.chemo = !!biome.chemo;

    // Founder plant community: productive, climate-generalist for this planet,
    // and initially *palatable* — physical and chemical defenses are near zero
    // and only evolve upward under real grazing pressure (coevolution).
    const pg = new Float32Array(CFG.PLANT_GENES);
    pg[PG.GROWTH]    = rng.range(0.5, 0.8);
    pg[PG.CAPACITY]  = rng.range(0.5, 0.8);
    pg[PG.DEFENSE]   = rng.range(0.0, 0.12);
    pg[PG.TOXICITY]  = rng.range(0.0, 0.12);
    pg[PG.COLD_TOL]  = rng.range(0.15, 0.3);  // cold-hardy edge (planet-relative)
    pg[PG.HEAT_TOL]  = rng.range(0.7, 0.85);  // heat-hardy edge
    pg[PG.DROUGHT]   = planet.oceanFrac < 0.2 ? rng.range(0.5, 0.85) : rng.range(0.2, 0.5);
    pg[PG.DISPERSAL] = rng.range(0.4, 0.7);
    pg[PG.ROOTING]   = rng.range(0.4, 0.7);
    this.plantGenes = pg;
    this.plantPheno = expressPlant(pg);
    this.plantBiomass = biome.maxBio * 0.4;

    // Founder microbe community — capable decomposers, mild pathogens.
    const mg = new Float32Array(CFG.MICROBE_GENES);
    mg[MG.DECOMP]    = rng.range(0.4, 0.7);
    mg[MG.CHEMO]     = biome.chemo ? rng.range(0.5, 0.8) : rng.range(0.1, 0.4);
    mg[MG.PATHOGEN]  = rng.range(0.05, 0.2);
    mg[MG.TOLERANCE] = rng.range(0.4, 0.7);
    mg[MG.SYMBIOSIS] = rng.range(0.2, 0.5);
    this.microbeGenes = mg;
    this.microbePheno = expressMicrobe(mg);
    this.microbeBiomass = 2 + biome.maxBio * 0.1;

    // Animal census (recomputed each tick).
    this.creatureCount = 0;
    this.herbCount = 0;
    this.carnCount = 0;

    // Nutrient cycle: carcasses -> carrion -> (microbial decomposition) -> soil.
    this.carrion = 0;
    this.nutrients = biome.maxBio * 0.2;
  }

  // Backwards-compatible accessor used by older UI/render code paths.
  get maxBiomass() { return this.baseCap * this.plantPheno.capacity; }
  get growthRate() { return this.baseGrowth * this.plantPheno.growth; }
}

// ============================================================
// SIMULATION
// ============================================================
class Simulation {
  constructor(seed, planet) {
    this.rng = new RNG(seed);
    this.planet = planet || DEFAULT_PLANET;
    this.world = new World(seed, this.planet);
    this.tick = 0;
    this.creatures = [];
    this.species = [];
    this.speciesMap = new Map(); // id -> Species
    this.spatialGrid = null; // rebuilt each tick
    this.ecosystem = new Array(CFG.W * CFG.H);
    this.history = []; // population snapshots
    this.paused = false;
    this.selectedTile = null;
    // --- realism systems ---
    this.season = 0;            // 0..1 phase through the orbital year
    this.seasonName = "Spring";
    this.climateShift = 0;      // transient global temperature offset (catastrophes)
    this.events = [];           // recent catastrophe log {tick, name, desc}
    this.infectedCount = 0;
    this.stats = { births: 0, starved: 0, predated: 0, aged: 0, disease: 0, cold: 0 };

    this.initEcosystem();
    this.initCreatures();
  }

  /// Global seasonal temperature offset for a given latitude row.
  /// Northern and southern hemispheres run opposite seasons; the equator
  /// barely changes. Amplitude scales with the planet's temperature span.
  seasonalTempOffset(y) {
    const amp = this.planet.tempSpan * 0.10;
    const hemisphere = (y < CFG.H / 2) ? 1 : -1;
    // Latitude weighting: poles swing hardest, equator least.
    const latWeight = Math.abs(y - CFG.H / 2) / (CFG.H / 2);
    return Math.sin(this.season * Math.PI * 2) * amp * hemisphere * (0.3 + 0.7 * latWeight)
      + this.climateShift;
  }

  /// Seasonal multiplier on plant productivity for a latitude row (~0.6..1.4).
  seasonalGrowthMul(y) {
    const hemisphere = (y < CFG.H / 2) ? 1 : -1;
    const phase = Math.sin(this.season * Math.PI * 2) * hemisphere;
    const latWeight = Math.abs(y - CFG.H / 2) / (CFG.H / 2);
    return 1 + phase * 0.35 * (0.3 + 0.7 * latWeight) - this.climateShift * 0.008;
  }

  /// Update the plant and microbe kingdoms across every tile: microbial
  /// decomposition feeding the soil, primary production (sunlight or
  /// chemosynthesis), and — on an interval — slow community evolution.
  updateFlora() {
    const W = CFG.W, eco = this.ecosystem, planet = this.planet;
    const pMin = planet.meanTemp - planet.tempSpan * 0.5;
    const pMax = planet.meanTemp + planet.tempSpan * 0.5;
    const light = planet.solar;
    for (let i = 0; i < eco.length; i++) {
      const t = eco[i];
      const y = (i / W) | 0;
      const mp = t.microbePheno;

      // Microbes decompose carcasses into soil nutrients; richer, more active
      // microbial communities recycle faster.
      if (t.carrion > 0) {
        const rate = Math.min(0.9, CFG.CARRION_DECAY * (0.4 + mp.decomp * (0.4 + t.microbeBiomass * 0.02)));
        const rotted = t.carrion * rate;
        t.carrion -= rotted;
        t.nutrients += rotted * CFG.CARRION_TO_NUTRIENT;
        if (t.carrion < 0.01) t.carrion = 0;
      }
      if (t.nutrients > 0) t.nutrients *= (1 - CFG.NUTRIENT_DECAY);

      // Microbe biomass tracks available food (nutrients, carrion, and
      // chemosynthesis at vents); chemotrophs persist with no sunlight at all.
      const microFood = t.nutrients * 0.08 + t.carrion * 0.2 + (t.chemo ? mp.chemo * 1.5 : light * 0.05);
      t.microbeBiomass += microFood - t.microbeBiomass * 0.05;
      if (t.microbeBiomass < 0.5) t.microbeBiomass = 0.5;
      else if (t.microbeBiomass > 80) t.microbeBiomass = 80;

      // Plant primary production.
      const cap = t.baseCap * t.plantPheno.capacity;
      if (cap > 0.5) {
        const pp = t.plantPheno;
        const localTemp = this.world.temperature[i] + this.seasonalTempOffset(y);
        const coldEdge = pMin - 6 + pp.coldGene * 26;
        const heatEdge = pMax + 6 - (1 - pp.heatGene) * 26;
        let climateOK = 1;
        if (localTemp < coldEdge) climateOK = Math.max(0, 1 - (coldEdge - localTemp) / 15);
        else if (localTemp > heatEdge) climateOK = Math.max(0, 1 - (localTemp - heatEdge) / 15);
        const rain = this.world.rainfall[i];
        const waterOK = Math.min(1, rain / 600 + pp.drought * 0.6 + 0.1);
        const seasonMul = Math.max(0.15, this.seasonalGrowthMul(y));
        // Energy source: starlight (seasonal) and/or microbial chemosynthesis.
        const lightTerm = Math.min(1.3, light * seasonMul + (t.chemo ? mp.chemo * 0.8 : 0));
        const nutrientMul = 1 + Math.min(1, t.nutrients / (cap + 1)) * pp.rooting;
        const symbiosis = 1 + mp.symbiosis * 0.4;
        const realized = t.baseGrowth * pp.growth * climateOK * waterOK * lightTerm * nutrientMul * symbiosis;
        if (realized > 0.001) {
          const growth = realized * (1 - t.plantBiomass / cap) * cap * 0.02;
          t.plantBiomass = Math.max(0, Math.min(cap, t.plantBiomass + growth));
          if (growth > 0) t.nutrients = Math.max(0, t.nutrients - growth * 0.12);
        } else {
          t.plantBiomass *= 0.99; // die back where the climate no longer suits
        }
      } else {
        t.plantBiomass *= 0.98;
      }
    }
    if (this.tick % CFG.FLORA_INTERVAL === 0) this.evolveFlora();
  }

  /// Slow evolution of the plant & microbe kingdoms: mutation explores trait
  /// space, and thriving communities colonise neighbouring tiles, so flora
  /// adapts to local climate and shifts range over time.
  evolveFlora() {
    const W = CFG.W, H = CFG.H, eco = this.ecosystem, rng = this.rng;
    for (let i = 0; i < eco.length; i++) {
      const t = eco[i];
      // Microbes mutate everywhere (they live in every tile).
      if (rng.chance(CFG.MICROBE_MUTATION)) {
        t.microbeGenes = mutateGenome(t.microbeGenes, CFG.MICROBE_GENES, 0.5, rng);
        t.microbePheno = expressMicrobe(t.microbeGenes);
      }
      if (t.baseCap <= 0.5) continue; // no plant lineage on barren/aquatic tiles
      if (rng.chance(CFG.PLANT_MUTATION)) {
        t.plantGenes = mutateGenome(t.plantGenes, CFG.PLANT_GENES, 0.5, rng);
        t.plantPheno = expressPlant(t.plantGenes);
      }
      // Colonisation: a markedly more successful neighbour seeds its lineage.
      const x = i % W, y = (i / W) | 0;
      const nx = (x + (rng.chance(0.5) ? 1 : -1) + W) % W;
      const ny = Math.max(0, Math.min(H - 1, y + (rng.chance(0.5) ? 1 : -1)));
      const nb = eco[ny * W + nx];
      if (nb.baseCap > 0.5 && nb.plantBiomass > t.plantBiomass * 1.25
          && rng.chance(0.2 + nb.plantPheno.dispersal * 0.5)) {
        t.plantGenes = mutateGenome(nb.plantGenes, CFG.PLANT_GENES, 0.25, rng);
        t.plantPheno = expressPlant(t.plantGenes);
      }
    }
  }

  initEcosystem() {
    for (let y = 0; y < CFG.H; y++) {
      for (let x = 0; x < CFG.W; x++) {
        const i = y * CFG.W + x;
        const biome = this.world.getBiome(x, y);
        this.ecosystem[i] = new TileEco(biome, this.planet, this.rng);
      }
    }
  }

  initCreatures() {
    // Find habitable tiles
    const habitable = [];
    for (let y = 0; y < CFG.H; y++) {
      for (let x = 0; x < CFG.W; x++) {
        if (this.world.isHabitable(x, y)) habitable.push([x, y]);
      }
    }
    if (habitable.length === 0) return;

    // Create herbivore species
    for (let s = 0; s < CFG.INIT_HERB_SPECIES; s++) {
      const base = new Float32Array(CFG.NUM_GENES);
      for (let g = 0; g < CFG.NUM_GENES; g++) base[g] = this.rng.range(0.2, 0.8);
      adaptBaseToPlanet(base, this.planet, this.rng);
      base[G.DIET] = this.rng.range(0.0, 0.30);  // herbivore
      base[G.AGGRESSION] = this.rng.range(0.0, 0.3);

      const col = SPECIES_COLORS[this.species.length % SPECIES_COLORS.length];
      const sp = new Species(generateSpeciesName(this.rng), col, base);
      sp.birthTick = 0;
      this.species.push(sp);
      this.speciesMap.set(sp.id, sp);

      for (let c = 0; c < CFG.CREATURES_PER_SPECIES; c++) {
        const [tx, ty] = habitable[this.rng.int(0, habitable.length)];
        const genes = randomGenome(this.rng, base, 0.08);
        genes[G.DIET] = Math.min(0.30, genes[G.DIET]);
        // Founders are sex-balanced 50/50 by RNG.
        const cr = new Creature(tx, ty, genes, sp.id, this.rng.chance(0.5) ? 0 : 1);
        this.creatures.push(cr);
        sp.population++;
        sp.totalBorn++;
      }
    }

    // Create carnivore species
    for (let s = 0; s < CFG.INIT_CARN_SPECIES; s++) {
      const base = new Float32Array(CFG.NUM_GENES);
      for (let g = 0; g < CFG.NUM_GENES; g++) base[g] = this.rng.range(0.2, 0.8);
      adaptBaseToPlanet(base, this.planet, this.rng);
      base[G.DIET] = this.rng.range(0.70, 1.0); // carnivore
      base[G.AGGRESSION] = this.rng.range(0.5, 1.0);
      base[G.SPEED] = this.rng.range(0.4, 0.9);

      const col = SPECIES_COLORS[this.species.length % SPECIES_COLORS.length];
      const sp = new Species(generateSpeciesName(this.rng), col, base);
      sp.birthTick = 0;
      this.species.push(sp);
      this.speciesMap.set(sp.id, sp);

      for (let c = 0; c < CFG.CREATURES_PER_SPECIES; c++) {
        const [tx, ty] = habitable[this.rng.int(0, habitable.length)];
        const genes = randomGenome(this.rng, base, 0.08);
        genes[G.DIET] = Math.max(0.70, genes[G.DIET]);
        // Founders are sex-balanced 50/50 by RNG.
        const cr = new Creature(tx, ty, genes, sp.id, this.rng.chance(0.5) ? 0 : 1);
        this.creatures.push(cr);
        sp.population++;
        sp.totalBorn++;
      }
    }
  }

  buildSpatialGrid() {
    this.spatialGrid = new Map();
    for (let i = 0; i < this.creatures.length; i++) {
      const c = this.creatures[i];
      if (!c.alive) continue;
      const key = c.y * CFG.W + c.x;
      if (!this.spatialGrid.has(key)) this.spatialGrid.set(key, []);
      this.spatialGrid.get(key).push(i);
    }
  }

  /// Wrap-aware horizontal delta. Returns the shorter of the two paths
  /// around the cylindrical world.
  wrapDX(a, b) {
    let d = a - b;
    if (d > CFG.W / 2) d -= CFG.W;
    else if (d < -CFG.W / 2) d += CFG.W;
    return d;
  }

  /// Find the most attractive food tile within sense range. Score balances
  /// plant biomass (for herbivores), prey biomass (for carnivores) and
  /// distance. Returns [x, y] or null.
  findNearestFood(c) {
    const ph = c.pheno;
    const wantPlant = !isCarnivore(ph);
    const wantMeat = !isHerbivore(ph);
    // Anything that isn't a pure herbivore, or that has a scavenging streak,
    // will detour for a free meal of carrion.
    const wantCarrion = wantMeat || ph.scavenge > 0.25;
    const sr = Math.min(8, Math.ceil(ph.senseRange));
    let best = null, bestScore = 0.5;
    for (let dy = -sr; dy <= sr; dy++) {
      const ny = c.y + dy;
      if (ny < 0 || ny >= CFG.H) continue;
      for (let dx = -sr; dx <= sr; dx++) {
        const nx = (c.x + dx + CFG.W) % CFG.W;
        const idx = ny * CFG.W + nx;
        let score = 0;
        if (wantPlant) score += this.ecosystem[idx].plantBiomass * (wantMeat ? 0.4 : 1.0);
        if (wantCarrion) score += this.ecosystem[idx].carrion * (1 + ph.scavenge * 2);
        if (wantMeat && this.spatialGrid) {
          const cell = this.spatialGrid.get(idx);
          if (cell) for (const oi of cell) {
            const o = this.creatures[oi];
            if (!o || !o.alive || o === c) continue;
            // Hunters target prey at most 1.5x their size.
            if (o.pheno.bodySize <= ph.bodySize * 1.5) {
              score += o.pheno.bodySize * (wantPlant ? 2 : 6);
            }
          }
        }
        const dist = Math.abs(dx) + Math.abs(dy);
        score -= dist * 0.4;
        if (score > bestScore) { bestScore = score; best = [nx, ny]; }
      }
    }
    return best;
  }

  /// Find the nearest carnivorous threat within sense range. Returns the
  /// threat's tile so callers can flee away from it.
  findNearestThreat(c) {
    if (!this.spatialGrid) return null;
    const sr = Math.min(8, Math.ceil(c.pheno.senseRange));
    let nearest = null, bestDist = Infinity;
    for (let dy = -sr; dy <= sr; dy++) {
      const ny = c.y + dy;
      if (ny < 0 || ny >= CFG.H) continue;
      for (let dx = -sr; dx <= sr; dx++) {
        const nx = (c.x + dx + CFG.W) % CFG.W;
        const cell = this.spatialGrid.get(ny * CFG.W + nx);
        if (!cell) continue;
        for (const oi of cell) {
          const o = this.creatures[oi];
          if (!o || !o.alive || o === c) continue;
          if (o.speciesId === c.speciesId) continue;
          if (!isCarnivore(o.pheno)) continue;
          if (o.pheno.bodySize < c.pheno.bodySize * 1.1) continue;
          if (!isMature(o)) continue;
          const dist = Math.abs(dx) + Math.abs(dy);
          // Camouflage reduces effective detection.
          const detection = 1 - o.pheno.camouflage * 0.6;
          if (dist < bestDist && Math.random() < detection) {
            bestDist = dist;
            nearest = [nx, ny];
          }
        }
      }
    }
    return nearest;
  }

  /// Find a same-species, opposite-sex, breeding-ready partner in range.
  /// Females (sex 0) exercise mate choice — sexual selection — preferring
  /// healthy, well-fed, ornamented partners even at some distance. Males
  /// just head for the nearest available female.
  findNearestMate(c) {
    if (!this.spatialGrid) return null;
    const sr = Math.min(8, Math.ceil(c.pheno.senseRange));
    const choosy = (c.sex === 0); // the choosing sex
    let best = null, bestScore = -Infinity, bestDist = Infinity;
    for (let dy = -sr; dy <= sr; dy++) {
      const ny = c.y + dy;
      if (ny < 0 || ny >= CFG.H) continue;
      for (let dx = -sr; dx <= sr; dx++) {
        const nx = (c.x + dx + CFG.W) % CFG.W;
        const cell = this.spatialGrid.get(ny * CFG.W + nx);
        if (!cell) continue;
        for (const oi of cell) {
          const o = this.creatures[oi];
          if (!o || !o.alive || o === c) continue;
          if (o.speciesId !== c.speciesId) continue;
          if (o.sex === c.sex) continue;
          if (!isMature(o) || o.breedCooldown > 0) continue;
          if (o.energy < o.pheno.fertility * 0.7) continue;
          const dist = Math.abs(dx) + Math.abs(dy);
          if (choosy) {
            // Quality = condition + ornament + vigour, discounted by distance.
            const quality = o.health * 1.5 + o.pheno.display * 2.0
              + (o.energy / (o.pheno.fertility + 1)) * 0.5
              + o.pheno.bodySize * 0.1 - dist * 0.15;
            if (quality > bestScore) { bestScore = quality; best = [nx, ny]; }
          } else if (dist < bestDist) {
            bestDist = dist; best = [nx, ny];
          }
        }
      }
    }
    return best;
  }

  /// Combat multiplier from same-species adults on the same and
  /// orthogonally-adjacent tiles. A creature with no pack instinct gets
  /// no benefit; gregarious creatures gain up to ~1.5x when surrounded.
  packBonus(c, x, y) {
    if (!this.spatialGrid || c.pheno.pack < 0.05) return 1;
    const offs = [[0,0],[1,0],[-1,0],[0,1],[0,-1]];
    let allies = 0;
    for (const [ox, oy] of offs) {
      const nx = (x + ox + CFG.W) % CFG.W;
      const ny = y + oy;
      if (ny < 0 || ny >= CFG.H) continue;
      const cell = this.spatialGrid.get(ny * CFG.W + nx);
      if (!cell) continue;
      for (const oi of cell) {
        const o = this.creatures[oi];
        if (!o || !o.alive || o === c) continue;
        if (o.speciesId === c.speciesId && isMature(o)) allies++;
      }
    }
    return 1 + Math.min(allies, 4) * 0.12 * c.pheno.pack;
  }

  /// Pick a movement target based on the creature's internal state.
  chooseGoal(c) {
    const ph = c.pheno;
    const sr = Math.min(8, Math.ceil(ph.senseRange));
    // 1) Flee — non-carnivores prioritise running from larger predators.
    if (!isCarnivore(ph)) {
      const threat = this.findNearestThreat(c);
      if (threat) {
        const tdx = this.wrapDX(c.x, threat[0]);
        const tdy = c.y - threat[1];
        c.targetX = (c.x + Math.sign(tdx) * sr + CFG.W) % CFG.W;
        c.targetY = Math.max(0, Math.min(CFG.H - 1, c.y + Math.sign(tdy) * sr));
        c.state = STATE.FLEE;
        return;
      }
    }
    // 2) Hungry — energy below 50% of breeding threshold means actively forage.
    const hungry = c.energy < ph.fertility * 0.5;
    if (hungry) {
      const food = this.findNearestFood(c);
      if (food) { c.targetX = food[0]; c.targetY = food[1]; c.state = STATE.SEEK_FOOD; return; }
    }
    // 3) Reproductive — well-fed adults seek mates of their species.
    if (isMature(c) && c.breedCooldown === 0 && c.energy > ph.fertility) {
      const mate = this.findNearestMate(c);
      if (mate) { c.targetX = mate[0]; c.targetY = mate[1]; c.state = STATE.SEEK_MATE; return; }
    }
    // 4) Default: explore. Bias drift toward food if mildly peckish.
    if (c.energy < ph.fertility * 0.85) {
      const food = this.findNearestFood(c);
      if (food) { c.targetX = food[0]; c.targetY = food[1]; c.state = STATE.SEEK_FOOD; return; }
    }
    c.targetX = (c.x + this.rng.int(-sr, sr + 1) + CFG.W) % CFG.W;
    c.targetY = Math.max(0, Math.min(CFG.H - 1, c.y + this.rng.int(-sr, sr + 1)));
    c.state = STATE.WANDER;
  }

  /// Begin an infection in a creature unless it is already sick or resistant.
  infect(c) {
    if (c.infected || c.resistant) return;
    if (this.rng.chance(c.pheno.immunity * 0.8)) return; // immune system blocks it
    c.infected = true;
    c.infectTimer = Math.floor(CFG.DISEASE_DURATION * (1 - c.pheno.immunity * 0.5));
  }

  /// Spread disease between co-located creatures and spark new outbreaks in
  /// dense populations. Crowding drives epidemics — a realistic density check.
  spreadDisease() {
    let infected = 0;
    for (const [key, cell] of this.spatialGrid) {
      if (cell.length < 2) {
        // Still let solitary infected creatures count toward the tally.
        for (const oi of cell) { const s = this.creatures[oi]; if (s && s.infected) infected++; }
        continue;
      }
      // Spontaneous outbreaks emerge from the local pathogenic microbe load,
      // amplified by crowding — disease is a real third-kingdom interaction.
      const density = cell.length;
      const eco = this.ecosystem[key];
      const pathogen = eco ? eco.microbePheno.pathogen : 0.2;
      const outbreak = CFG.DISEASE_BASE_RATE * density * density * (0.3 + pathogen * 3);
      for (const oi of cell) {
        const c = this.creatures[oi];
        if (!c || !c.alive) continue;
        if (!c.infected && !c.resistant && this.rng.chance(outbreak)) {
          this.infect(c);
        }
      }
      // Contact transmission from each infected individual to tile-mates.
      for (const oi of cell) {
        const src = this.creatures[oi];
        if (!src || !src.alive || !src.infected) continue;
        for (const oj of cell) {
          if (oj === oi) continue;
          const t = this.creatures[oj];
          if (!t || !t.alive || t.infected || t.resistant) continue;
          if (this.rng.chance(CFG.DISEASE_SPREAD * (1 - t.pheno.immunity))) {
            this.infect(t);
          }
        }
      }
      for (const oi of cell) { const s = this.creatures[oi]; if (s && s.infected) infected++; }
    }
    this.infectedCount = infected;
  }

  /// Rare planet-scale catastrophes that reshape selection — the punctuation
  /// in "punctuated equilibrium". Each picks survivors differently.
  maybeCatastrophe() {
    if (this.tick < 200) return; // give life a chance to establish first
    if (!this.rng.chance(CFG.CATASTROPHE_RATE)) return;
    const kinds = ['impact', 'supervolcano', 'pandemic', 'heatwave', 'iceage'];
    const kind = kinds[this.rng.int(0, kinds.length)];
    let desc = '';
    switch (kind) {
      case 'impact': {
        // Asteroid impact: regional annihilation + global cooling (dust).
        const cx = this.rng.int(0, CFG.W), cy = this.rng.int(0, CFG.H);
        const r = 18 + this.rng.int(0, 14);
        let killed = 0;
        for (const c of this.creatures) {
          const dx = Math.min(Math.abs(c.x - cx), CFG.W - Math.abs(c.x - cx));
          const dy = Math.abs(c.y - cy);
          if (dx * dx + dy * dy < r * r && this.rng.chance(0.85)) {
            c.alive = false; c.deathCause = 'impact'; killed++;
          }
        }
        this.climateShift -= 12; // impact winter
        desc = `Asteroid impact wiped out ${killed} creatures; an impact winter sets in.`;
        break;
      }
      case 'supervolcano': {
        this.climateShift -= 9;
        let killed = 0;
        for (const c of this.creatures) {
          if (this.rng.chance(0.12)) { c.alive = false; c.deathCause = 'volcano'; killed++; }
        }
        desc = `A supervolcano blots out the sun — volcanic winter, ${killed} dead.`;
        break;
      }
      case 'pandemic': {
        let n = 0;
        for (const c of this.creatures) {
          if (!c.resistant && this.rng.chance(0.5)) { this.infect(c); n++; }
        }
        desc = `A virulent pandemic erupts, infecting ${n} creatures worldwide.`;
        break;
      }
      case 'heatwave': {
        this.climateShift += 11;
        desc = `A runaway greenhouse pulse spikes global temperatures.`;
        break;
      }
      case 'iceage': {
        this.climateShift -= 11;
        desc = `A glacial period descends; the world turns bitterly cold.`;
        break;
      }
    }
    this.events.unshift({ tick: this.tick, name: kind, desc });
    if (this.events.length > 12) this.events.pop();
  }

  step() {
    this.tick++;

    // Phase 0: Advance the seasonal clock and decay any transient climate
    // shock from a past catastrophe back toward zero.
    this.season = (this.tick % CFG.YEAR_LENGTH) / CFG.YEAR_LENGTH;
    const sphase = Math.sin(this.season * Math.PI * 2);
    this.seasonName = sphase > 0.4 ? "Summer" : sphase < -0.4 ? "Winter"
      : (this.season < 0.5 ? "Spring" : "Autumn");
    if (this.climateShift !== 0) this.climateShift *= 0.985;
    if (Math.abs(this.climateShift) < 0.05) this.climateShift = 0;
    this.maybeCatastrophe();

    // Build the spatial index up front so movement/sensing in Phase 1 query a
    // grid whose indices match the current (post-cull) creatures array.
    this.buildSpatialGrid();

    // Phase 1: Movement & metabolism
    for (const c of this.creatures) {
      if (!c.alive) continue;

      // Choose direction — goal-driven, replanned every few ticks. Fleeing
      // creatures replan more often so they actually evade rather than
      // stubbornly march into the predator they were running from.
      c.moveTimer--;
      if (c.moveTimer <= 0) {
        this.chooseGoal(c);
        c.moveTimer = (c.state === STATE.FLEE) ? 1 : 3;
      }

      // Move toward target
      const dx = c.targetX - c.x;
      const dy = c.targetY - c.y;
      if (dx !== 0 || dy !== 0) {
        // Wrap-aware movement
        let mx = 0, my = 0;
        if (dx !== 0) mx = Math.sign(dx);
        if (dy !== 0) my = Math.sign(dy);
        // Handle horizontal wrapping
        if (Math.abs(dx) > CFG.W / 2) mx = -mx;

        const newX = (c.x + mx + CFG.W) % CFG.W;
        const newY = Math.max(0, Math.min(CFG.H - 1, c.y + my));

        // Check if target tile is habitable
        if (this.world.isHabitable(newX, newY)) {
          c.x = newX;
          c.y = newY;
        }

        // Movement energy cost — heavier, faster bodies pay more, and
        // high gravity makes every step costlier.
        c.energy -= c.pheno.bodySize * c.pheno.speed * 0.15
          * (0.6 + 0.4 * this.planet.gravity);
      }

      // Environmental stress — local temperature now includes the season.
      // Thermal tolerance is expressed relative to the planet's own range, so
      // life can evolve to inhabit a −90 °C cryoworld or a +60 °C hothouse
      // just as readily as a temperate one (real extremophiles do exactly this).
      const temp = this.world.temperature[c.y * CFG.W + c.x]
        + this.seasonalTempOffset(c.y);
      const pMin = this.planet.meanTemp - this.planet.tempSpan * 0.5;
      const pMax = this.planet.meanTemp + this.planet.tempSpan * 0.5;
      const coldTolEff = pMin - 6 + c.pheno.coldGene * 26; // low gene ⇒ cold-hardy
      const heatTolEff = pMax + 6 - (1 - c.pheno.heatGene) * 26; // high gene ⇒ heat-hardy
      if (temp < coldTolEff) {
        // Endotherms (warm-blooded) buffer the cold; ectotherms take it raw.
        const buffer = 1 - c.pheno.thermoreg * 0.7;
        c.health -= Math.abs(temp - coldTolEff) / 20 * 0.05 * buffer;
        if (c.health <= 0) c.deathCause = 'cold';
      }
      if (temp > heatTolEff) {
        c.health -= (temp - heatTolEff) / 20 * 0.05;
        if (c.health <= 0) c.deathCause = 'heat';
      }

      // Drought stress
      const rain = this.world.rainfall[c.y * CFG.W + c.x];
      const waterNeedScaled = c.pheno.waterNeed * 500;
      if (rain < waterNeedScaled) {
        c.health -= (waterNeedScaled - rain) / 500 * 0.02;
      }

      // Base metabolism follows Kleiber's law: metabolic demand scales as
      // body-mass^0.75, not linearly — so big animals are far more
      // energy-efficient per kilo, exactly as in real ecosystems. The
      // metabolism gene sets each lineage's tempo, photosynthesis offsets it.
      const massCost = Math.pow(c.pheno.bodySize, CFG.METABOLIC_EXPONENT);
      // Endothermy raises resting cost (the price of warm blood); a big brain
      // is also metabolically expensive to run.
      const thermoCost = 1 + c.pheno.thermoreg * 0.5;
      c.energy -= massCost * (2.0 - c.pheno.efficiency) * 0.3
        * c.pheno.metabolism * thermoCost * (1 - 0.4 * c.pheno.photosyn);
      if (c.pheno.intelligence > 0.05) c.energy -= massCost * c.pheno.intelligence * 0.08;

      // Sexual ornaments are metabolically expensive to grow and maintain.
      if (c.pheno.display > 0.05) c.energy -= c.pheno.display * 0.25;

      c.age++;

      // Planetary pressures — the real point of running on an alien world.
      const P = this.planet;
      // Ionizing radiation damage (atmospheric shielding is folded into
      // P.radiation already).
      const unshielded = Math.max(0, P.radiation - c.pheno.radTol);
      if (unshielded > 0) {
        c.health -= unshielded * 0.035;
        c.energy -= unshielded * 0.4;
      }
      // Toxic atmosphere.
      const exposed = Math.max(0, P.toxicity - c.pheno.toxTol);
      if (exposed > 0) {
        c.health -= exposed * 0.04;
        c.energy -= exposed * 0.5;
      }
      // Pressure mismatch — both too-low and too-high hurt.
      const pTarget = Math.min(1, P.gravity * 0.5); // proxy
      const pGap = Math.abs(pTarget - c.pheno.pressTol);
      if (pGap > 0.2) {
        c.energy -= (pGap - 0.2) * 0.35;
      }
      // Gravity cost: heavy bodies pay more on high-g worlds.
      if (P.gravity > 1.0) {
        c.energy -= (P.gravity - 1.0) * c.pheno.bodySize * 0.08;
      }
      // Passive photosynthesis — scaled by the star's output and the season.
      if (c.pheno.photosyn > 0.05) {
        c.energy += c.pheno.photosyn * P.solar * 0.4
          * Math.max(0.2, this.seasonalGrowthMul(c.y));
      }

      // Disease progression: infections drain health, then resolve. A strong
      // immune system shortens them and improves the odds of recovery.
      if (c.infected) {
        c.health -= 0.012 * (1 - c.pheno.immunity * 0.6);
        c.energy -= 0.3;
        c.infectTimer--;
        if (c.infectTimer <= 0) {
          // Survived: clear the infection and gain lasting resistance.
          c.infected = false;
          c.resistant = true;
        }
        if (c.health <= 0) c.deathCause = 'disease';
      }

      // Senescence: past ~70% of lifespan, mortality hazard climbs steeply
      // even with full health — nothing lives forever.
      const ageFrac = c.age / c.pheno.maxAge;
      if (ageFrac > 0.7) {
        const hazard = (ageFrac - 0.7) * 0.03;
        if (this.rng.chance(hazard)) { c.health = 0; c.deathCause = 'aged'; }
      }

      // Death checks
      if (c.age > c.pheno.maxAge) { c.alive = false; if (!c.deathCause) c.deathCause = 'aged'; }
      else if (c.energy <= 0) { c.alive = false; c.deathCause = 'starved'; }
      else if (c.health <= 0) { c.alive = false; if (!c.deathCause) c.deathCause = 'environment'; }

      if (c.breedCooldown > 0) c.breedCooldown--;
    }

    // Phase 2: Build spatial index & update ecosystem counts
    this.buildSpatialGrid();

    // Reset eco counts
    for (let i = 0; i < this.ecosystem.length; i++) {
      this.ecosystem[i].creatureCount = 0;
      this.ecosystem[i].herbCount = 0;
      this.ecosystem[i].carnCount = 0;
    }

    for (const c of this.creatures) {
      if (!c.alive) continue;
      const eco = this.ecosystem[c.y * CFG.W + c.x];
      eco.creatureCount++;
      if (c.pheno.diet < 0.35) eco.herbCount++;
      else if (c.pheno.diet > 0.65) eco.carnCount++;
      else { eco.herbCount += 0.5; eco.carnCount += 0.5; }
    }

    // Phase 2a: Microbe & plant kingdoms (decomposition, primary production,
    // and slow community evolution). Run on an interval for performance.
    this.updateFlora();

    // Phase 2b: Feeding
    for (const c of this.creatures) {
      if (!c.alive) continue;
      const eco = this.ecosystem[c.y * CFG.W + c.x];

      // Herbivore feeding. Plant physical defense reduces how much a grazer
      // can crop; chemical toxicity poisons grazers that lack detox capacity
      // (TOX_TOL gene) — driving plant–herbivore coevolution. Digestion and
      // the diet gene set how much energy is actually extracted.
      if (c.pheno.diet < 0.6 && eco.plantBiomass > 0) {
        const pp = eco.plantPheno;
        const defenseMul = 1 - pp.defense * 0.7;
        const maxIntake = c.pheno.bodySize * 3.0 * (1 - c.pheno.diet) * defenseMul;
        const consumed = Math.min(maxIntake, eco.plantBiomass);
        eco.plantBiomass -= consumed;
        const digest = 0.6 + c.pheno.digestion * 0.6;
        c.energy += consumed * (1 - c.pheno.diet) * 0.8 * digest;
        // Toxic plants harm unprotected grazers.
        const poison = pp.toxicity - c.pheno.toxTol;
        if (poison > 0) { c.health -= poison * 0.06; c.energy -= poison * 1.5; }
      }

      // Scavenging: feed on carrion lying on this tile. Anything carnivorous
      // can, but dedicated scavengers extract far more from a carcass.
      if (eco.carrion > 0 && (c.pheno.diet > 0.2 || c.pheno.scavenge > 0.25)) {
        const eff = 0.3 + c.pheno.scavenge * 0.9;
        const maxIntake = c.pheno.bodySize * 2.5 * eff;
        const consumed = Math.min(maxIntake, eco.carrion);
        eco.carrion -= consumed;
        c.energy += consumed * eff;
        if (c.state !== undefined) c.activityNote = 'scavenging';
      }

      // Carnivore hunting
      if (c.pheno.diet > 0.2 && c.pheno.aggression > 0.2 && isMature(c)) {
        const key = c.y * CFG.W + c.x;
        const tileCreatures = this.spatialGrid.get(key);
        if (tileCreatures && tileCreatures.length > 1) {
          // Pick a random potential prey
          const preyIdx = tileCreatures[this.rng.int(0, tileCreatures.length)];
          const prey = this.creatures[preyIdx];
          if (prey !== c && prey.alive && prey.pheno.bodySize < c.pheno.bodySize * 1.5) {
            // Detection check — camouflage hides prey, and clever prey are
            // harder to catch (the hunter's own wits help it close in).
            const detectChance = (c.pheno.senseRange / 8.0)
              * (1 + c.pheno.intelligence * 0.3)
              * (1 - prey.pheno.camouflage * 0.7)
              * (1 - prey.pheno.intelligence * 0.3);
            if (this.rng.chance(detectChance)) {
              // Pack bonus: count same-species adults around hunter and prey
              // and inflate their combat power. Hunting in a pack works,
              // and prey defended by a herd is much harder to kill.
              const hunterPack = this.packBonus(c, c.x, c.y);
              const preyPack   = this.packBonus(prey, prey.x, prey.y);
              // Juveniles fight worse than their adult selves.
              const hunterMatMul = isMature(c)    ? 1 : 0.5;
              const preyMatMul   = isMature(prey) ? 1 : 0.5;
              const hunterPower = (c.pheno.bodySize * c.pheno.speed * 0.5
                + c.pheno.aggression * 2.0) * hunterPack * hunterMatMul;
              // Prey gets a defender disadvantage but armour helps.
              const preyArmor = 1 + prey.pheno.armor * 1.2;
              const preyPower = ((prey.pheno.bodySize * prey.pheno.speed * 0.5
                + prey.pheno.aggression * 2.0) * 0.6 * preyPack * preyMatMul) * preyArmor;
              const successChance = hunterPower / (hunterPower + preyPower);
              if (this.rng.chance(successChance)) {
                // Kill — hunter's reward scales with diet, but venom in
                // prey leaves a parting injury.
                const foodValue = prey.pheno.bodySize * 12.0;
                c.energy += foodValue * c.pheno.diet * (0.7 + c.pheno.digestion * 0.5);
                prey.alive = false;
                prey.deathCause = 'predated';
                this.stats.predated++;
                // Predator transmits disease through the kill, and may catch
                // a parasite load from infected prey.
                if (prey.infected && !c.resistant
                    && this.rng.chance(0.3 * (1 - c.pheno.immunity))) {
                  this.infect(c);
                }
                if (prey.pheno.venom > 0.05) {
                  c.health -= prey.pheno.venom * 0.3;
                  c.energy -= prey.pheno.venom * 4.0;
                }
              } else {
                // Failed hunt: both bleed, and venomous prey hit back hard.
                c.energy -= 2.0;
                prey.energy -= 1.0;
                if (this.rng.chance(0.2 + prey.pheno.venom * 0.5)) {
                  c.health -= 0.05 + prey.pheno.venom * 0.15;
                }
                prey.lastAttackerId = c.speciesId;
              }
            }
          }
        }
      }
    }

    // Phase 2d: Disease spread. Infections jump between creatures sharing a
    // tile, and arise spontaneously where crowding is high — a built-in,
    // density-dependent check on overpopulation that selects for immunity.
    this.spreadDisease();

    // Phase 3a: Conception. A receptive female pairs with the best available
    // male on her tile (mate choice already steered her there) and becomes
    // pregnant, storing the father's genes to combine at birth.
    for (let i = 0; i < this.creatures.length; i++) {
      const c = this.creatures[i];
      if (!c.alive || c.sex !== 0) continue;               // only females gestate
      if (c.pregnant || !isMature(c) || c.breedCooldown > 0) continue;
      if (c.energy < c.pheno.fertility * 0.85) continue;

      const tileCreatures = this.spatialGrid.get(c.y * CFG.W + c.x);
      if (!tileCreatures) continue;

      let mate = null, bestQ = -Infinity;
      for (const idx of tileCreatures) {
        const m = this.creatures[idx];
        if (!m || m === c || !m.alive || m.sex === 0) continue;
        if (m.speciesId !== c.speciesId) continue;
        if (!isMature(m) || m.breedCooldown > 0 || m.energy < m.pheno.fertility * 0.5) continue;
        // Female prefers the fittest, most ornamented suitor present.
        const q = m.health * 1.5 + m.pheno.display * 2 + m.pheno.bodySize * 0.1;
        if (q > bestQ) { bestQ = q; mate = m; }
      }
      if (!mate) continue;

      c.pregnant = true;
      c.mateGenes = mate.genes;
      // Gestation scales with lifespan: long-lived K-strategists invest
      // more time per litter than short-lived r-strategists.
      c.gestation = Math.floor(5 + c.pheno.maxAge / 20);
      c.breedCooldown = Math.floor(10 + c.pheno.maxAge / 12);
      mate.breedCooldown = Math.floor(6 + mate.pheno.maxAge / 14);
      mate.energy -= mate.pheno.fertility * 0.1; // courtship/mating cost
    }

    // Phase 3b: Gestation & live birth.
    const newCreatures = [];
    for (let i = 0; i < this.creatures.length; i++) {
      const c = this.creatures[i];
      if (!c.alive || !c.pregnant) continue;
      c.gestation--;
      // Gestation is metabolically costly; a starving mother miscarries.
      c.energy -= c.pheno.fertility * 0.02;
      if (c.energy < c.pheno.fertility * 0.25) { c.pregnant = false; c.mateGenes = null; continue; }
      if (c.gestation > 0) continue;

      const fatherGenes = c.mateGenes || c.genes;
      const litter = Math.round((c.pheno.offspringCnt
        + expressGene(fatherGenes).offspringCnt) / 2);
      const costPer = c.pheno.fertility * 0.3;
      for (let o = 0; o < litter && this.creatures.length + newCreatures.length < CFG.MAX_CREATURES; o++) {
        const childGenes = crossover(c.genes, fatherGenes, this.rng, this.planet.mutation);
        const child = new Creature(c.x, c.y, childGenes, c.speciesId, this.rng.chance(0.5) ? 0 : 1);
        child.energy = costPer * 0.8;
        // Vertical disease transmission: an infected mother may pass it on.
        if (c.infected && this.rng.chance(0.25 * (1 - child.pheno.immunity))) this.infect(child);
        newCreatures.push(child);
        this.stats.births++;
        const sp = this.speciesMap.get(c.speciesId);
        if (sp) {
          sp.population++;
          sp.totalBorn++;
          sp.generation = Math.max(sp.generation, Math.floor(c.age / c.pheno.maxAge * 10));
        }
      }
      c.energy -= costPer * litter * 0.7;
      c.pregnant = false;
      c.mateGenes = null;
    }
    this.creatures.push(...newCreatures);

    // Phase 4: Remove dead — carcasses drop carrion onto their tile, seeding
    // the scavenger food supply and the nutrient cycle. Predated bodies leave
    // less behind because the hunter already ate its fill.
    for (const c of this.creatures) {
      if (!c.alive) {
        const eco = this.ecosystem[c.y * CFG.W + c.x];
        if (eco) {
          const leftover = (c.deathCause === 'predated') ? 0.3 : 1.0;
          eco.carrion += c.pheno.bodySize * CFG.CARRION_FRACTION * leftover;
        }
        if (c.deathCause === 'starved') this.stats.starved++;
        else if (c.deathCause === 'aged') this.stats.aged++;
        else if (c.deathCause === 'disease') this.stats.disease++;
        else if (c.deathCause === 'cold' || c.deathCause === 'heat') this.stats.cold++;
        const sp = this.speciesMap.get(c.speciesId);
        if (sp) {
          sp.population--;
          sp.totalDied++;
          if (sp.population <= 0 && !sp.extinct) {
            sp.extinct = true;
            sp.extinctTick = this.tick;
          }
        }
      }
    }
    this.creatures = this.creatures.filter(c => c.alive);

    // Phase 5: Speciation check
    if (this.tick % CFG.SPECIATION_INTERVAL === 0) {
      this.checkSpeciation();
    }

    // Phase 6: Snapshot
    if (this.tick % CFG.SNAPSHOT_INTERVAL === 0) {
      this.takeSnapshot();
    }
  }

  checkSpeciation() {
    for (const c of this.creatures) {
      const sp = this.speciesMap.get(c.speciesId);
      if (!sp) continue;
      const dist = geneticDistance(c.genes, sp.genome);
      if (dist > CFG.SPECIATION_THRESHOLD) {
        // New species!
        const col = SPECIES_COLORS[this.species.length % SPECIES_COLORS.length];
        const newSp = new Species(generateSpeciesName(this.rng), col, c.genes);
        newSp.birthTick = this.tick;
        newSp.generation = sp.generation + 1;
        this.species.push(newSp);
        this.speciesMap.set(newSp.id, newSp);

        // Reassign this creature
        sp.population--;
        c.speciesId = newSp.id;
        newSp.population++;
        newSp.totalBorn++;

        // Check nearby same-species creatures
        for (const other of this.creatures) {
          if (other === c || !other.alive || other.speciesId !== sp.id) continue;
          const dx = Math.abs(other.x - c.x);
          const dy = Math.abs(other.y - c.y);
          if (dx < 10 && dy < 10) {
            const d2 = geneticDistance(other.genes, c.genes);
            if (d2 < CFG.SPECIATION_THRESHOLD * 0.7) {
              sp.population--;
              other.speciesId = newSp.id;
              newSp.population++;
              newSp.totalBorn++;
            }
          }
        }
      }
    }
  }

  takeSnapshot() {
    let herbs = 0, carns = 0;
    for (const c of this.creatures) {
      if (c.pheno.diet < 0.35) herbs++;
      else if (c.pheno.diet > 0.65) carns++;
      else { herbs += 0.5; carns += 0.5; }
    }
    const livingSpecies = this.species.filter(s => !s.extinct).length;

    this.history.push({
      tick: this.tick,
      total: this.creatures.length,
      herbivores: Math.round(herbs),
      carnivores: Math.round(carns),
      species: livingSpecies
    });

    if (this.history.length > CFG.MAX_SNAPSHOTS) {
      this.history = this.history.slice(this.history.length - CFG.MAX_SNAPSHOTS + 100);
    }

    // Update species max pop
    for (const sp of this.species) {
      if (sp.population > sp.maxPop) sp.maxPop = sp.population;
    }
  }

  getLivingSpecies() {
    return this.species.filter(s => !s.extinct && s.population > 0)
      .sort((a, b) => b.population - a.population);
  }

  getTileInfo(x, y) {
    const i = y * CFG.W + x;
    const biome = BIOME_LIST[this.world.biome[i]];
    const eco = this.ecosystem[i];
    const creaturesHere = [];
    for (const c of this.creatures) {
      if (c.alive && c.x === x && c.y === y) creaturesHere.push(c);
    }
    const pp = eco.plantPheno, mp = eco.microbePheno;
    return {
      x, y, biome: biome.name,
      altitude: Math.round(this.world.altitude[i]),
      temperature: (this.world.temperature[i] + this.seasonalTempOffset(y)).toFixed(1),
      rainfall: Math.round(this.world.rainfall[i]),
      plantBiomass: eco.plantBiomass.toFixed(1),
      maxBiomass: eco.maxBiomass.toFixed(0),
      growthRate: (eco.growthRate * 100).toFixed(0),
      carrion: eco.carrion.toFixed(1),
      nutrients: eco.nutrients.toFixed(1),
      // Kingdom: Plantae
      plant: {
        defense: (pp.defense * 100).toFixed(0),
        toxicity: (pp.toxicity * 100).toFixed(0),
        drought: (pp.drought * 100).toFixed(0)
      },
      // Kingdom: Microbiota
      microbe: {
        biomass: eco.microbeBiomass.toFixed(1),
        decomp: (mp.decomp * 50).toFixed(0),
        chemo: (mp.chemo * 100).toFixed(0),
        pathogen: (mp.pathogen * 100).toFixed(0),
        symbiosis: (mp.symbiosis * 100).toFixed(0)
      },
      creatures: creaturesHere,
      creatureCount: eco.creatureCount
    };
  }

  /// Snapshot of global realism state for the UI.
  getWorldStatus() {
    return {
      season: this.seasonName,
      seasonPhase: this.season,
      year: Math.floor(this.tick / CFG.YEAR_LENGTH) + 1,
      climateShift: this.climateShift,
      infected: this.infectedCount,
      events: this.events,
      stats: this.stats
